      "Body": "Big Board Map Center Gps Coordinates. Explicit board-center coordinates take precedence over address geocoding. Partial coordinates do not overwrite the saved center.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-bigboardmapcentergpscoordinates",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "responder-app",
      "Locale": "en",
      "TitleKey": "Feature.responder-app",
      "Body": "Responder application The member app for receiving dispatches, responding and setting status. Separate member device setup from department configuration and verify each member's channels. Members install the Responder app, a tablet in Engine 1 runs the Unit app and a station screen shows the Big Board. Have every member install the Responder app, sign in and allow notifications.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "responder-app",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "unit-app",
      "Locale": "en",
      "TitleKey": "Feature.unit-app",
      "Body": "Unit application The in-vehicle app that represents an apparatus. Review device identity, assigned crew and unit communications together. Members install the Responder app, a tablet in Engine 1 runs the Unit app and a station screen shows the Big Board. Install the Unit app on each apparatus tablet and select its unit.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "unit-app",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
