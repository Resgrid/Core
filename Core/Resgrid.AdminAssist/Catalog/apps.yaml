    {
      "Id": "big-board",
      "Locale": "en",
      "TitleKey": "Feature.big-board",
      "Body": "Big Board A station display of calls, units and personnel. Choose display refresh, location age and visibility appropriate to a station screen. Members install the Responder app, a tablet in Engine 1 runs the Unit app and a station screen shows the Big Board. Open the Big Board on a station screen and choose what it shows.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "big-board",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "dashboard",
      "Locale": "en",
      "TitleKey": "Feature.dashboard",
      "Body": "Dashboard The department home page: current status, staffing and activity. The classic dashboard shows the personnel status table with everyone's status and staffing, the member's own Actions and Staffing Level panels, and Department Info (department ID, code and text-to-call number). When the Dashboard.Modern feature flag is on, the home page is the customizable widget dashboard instead, and each member can still choose Use the classic dashboard.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dashboard",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-31T00:00:00Z"
    },
    {
      "Id": "home-dashboard",
      "Locale": "en",
      "TitleKey": "Feature.home-dashboard",
      "Body": "Customizable home dashboard The new home page (Home, /User/Home/Dashboard) is a board of live widgets such as Active Calls, My Status, Unit Status Board, Operations Map, Upcoming Events and Checklists Due - more than 70 widgets covering every module and paid add-on, grouped in eleven categories. Each member arranges their own board: which widgets, their size (XS, S, M, L, XL or Full), their order and their settings. Boards are saved on the server per member and per department, so the same board appears in any browser the member signs in on; a member can keep up to five boards. Every widget shows only what the member could see on the module page itself: the same permissions, module switches, feature flags, add-ons and visibility rules. A widget the member loses access to stays in the layout, hidden, and returns when access does. Widgets for calls, units, personnel, checklists and chat update live; the others refresh every 1 to 60 minutes. Members who never customize see the department's dashboard template or the built-in default for their role. The new dashboard is behind the Dashboard.Modern feature flag, off by default, and members can always switch back to the classic dashboard.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "home-dashboard",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-31T00:00:00Z"
    },
    {
      "Id": "dashboard-templates",
      "Locale": "en",
      "TitleKey": "Feature.dashboard-templates",
      "Body": "Dashboard templates Department admins only (there is no permission to delegate it): on the home dashboard open More dashboard options (the ... button) and choose Dashboard templates, or go to /User/Dashboard/Templates. A template is a board - widgets, sizes, order and settings - with a Name, an optional Description, For (Everyone, one Personnel role or one Group), a Priority (lower numbers win when a member matches several templates) and a Department default checkbox (at most one per department; members not matched by a role or group template see it). New template opens the dashboard in template mode, starting from the built-in administrator board: add widgets, drag, size, open Settings, then Save template. Previews show the admin's own data; each member sees only what their permissions allow, and widgets they cannot use are left out. Members who have never saved a board see template changes at once; members who customized keep their board until they choose Reset to department default. A department can keep up to 25 templates. Saves and deletes are recorded in the system audit trail as DashboardTemplateChanged.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dashboard-templates",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-31T00:00:00Z"
    },
    {
      "Id": "dashboard-customize",
      "Locale": "en",
      "TitleKey": "Topic.dashboard-customize",
      "Body": "Customizing the home dashboard Members press Customize. Drag a widget by its handle (press and hold on a touch screen) or focus it and use the arrow keys; pick a size chip or press + and -; remove it with the remove button or Delete, with Undo in the notice. Add widget opens the gallery with category tabs (Operations, Personnel, Map & weather, Communications, Planning, Readiness, Records, Workforce & Business, Incident Back Office, Intelligence, Administration) and a search box; a few widgets, such as Unit Status Board and My Note, can be added more than once. Each widget menu has Refresh, Settings, Open module, size and Remove; Settings holds options such as rows, priorities, station, group or unit type filters and days ahead. Done saves, Cancel discards the changes, and Reset to department default replaces the board with the template that applies to the member or the built-in default. The More dashboard options menu holds Density (Comfortable or Compact), Wall display (hides the sidebar and top bar for a station screen; it never reveals protected data and does not change session time-outs), Add board (up to five boards; the Home board cannot be deleted) and Use the classic dashboard. A board holds up to 40 widgets. If the board was changed in another window, a banner offers Keep mine or Load latest.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dashboard-customize",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-31T00:00:00Z"
    },
    {
      "Id": "dashboard-defaults",
      "Locale": "en",
      "TitleKey": "Topic.dashboard-defaults",
      "Body": "Which dashboard a member sees The board resolves in this order: (1) the member's own saved board; (2) the first role or group template that matches one of their personnel roles or their group, lowest Priority first, then by name; (3) the department default template; (4) the built-in default for their audience. Audience: Administrator is a department admin; Dispatcher / Officer can create calls or is a group admin; Member is everyone else. Built-in Member board: My Status, Active Calls, Upcoming Events, Inbox, My Shifts & Trades, Checklists Due, My Trainings, My Certifications, Chat, Weather Alerts, Personnel Status Board. Dispatcher / Officer: My Status, Call Activity, Units Summary, Staffing Summary, Active Calls, Unit Status Board, Operations Map, Awaiting Resources, Pending & Scheduled, Unit Status Alerts, Weather Alerts, Inbox, Personnel Status Board. Administrator: Setup Progress, Call Activity, Staffing Summary, My Status, Active Calls, Unit Status Board, Certification Expiry, Checklist Compliance, Work Orders, Records Overview, Accounts Receivable, Active Incidents, Plan & Add-ons, Workflow Health, Personnel Status Board. Widgets the member cannot use are dropped and the grid closes the gap. A member who has never saved has no stored board, so a template edit reaches them immediately and a role or group change takes effect at once; their first save makes the board theirs.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dashboard-defaults",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-31T00:00:00Z"
    },
    {
      "Id": "dashboard-addon-widgets",
      "Locale": "en",
      "TitleKey": "Topic.dashboard-addon-widgets",
      "Body": "Add-on widgets and locked cards Widgets for paid add-ons appear only while the add-on is active: Push-To-Talk (PTT); Data Protection (Advanced Data Protection); Work Orders and My Work Orders (Readiness Pro); Accounts Receivable, Online Payments, Bids, Contracts, Cal OES MARS, Field Costing and Pay Data Completeness (Business Ops); Assistant and AI Dispatch Triage (Enhanced AI); Active Incidents, Incident Desk, Incident Resources, Check-in Queue, Incident Costs and Coordination Boards (Incident Back Office). Invoicing and Incident Back Office widgets keep showing read-only figures after the add-on lapses, as their modules do. Members never see upsell: a widget for an add-on the department lacks is simply not in their gallery. Department admins see those widgets in the Add widget gallery as locked cards (Available with the add-on, and View add-on, which opens its billing page); a locked card cannot be added, and only add-ons the installation offers are shown. A lapsed add-on never removes a widget from anyone's layout: it is hidden and returns when the add-on is bought again.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dashboard-addon-widgets",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-31T00:00:00Z"
    },
    {
      "Id": "dashboard-data-protection",
      "Locale": "en",
      "TitleKey": "Topic.dashboard-data-protection",
      "Body": "Protected data on the dashboard In a department enrolled in Advanced Data Protection, widgets are built on operational data - counts, statuses, call numbers and types, unit and personnel names, map pins, dates - which is never protected. Four widgets can carry a protected value, hidden by default: Inbox message subjects (shown as Protected message), Unit Status Board status notes and Personnel Status Board staffing notes (a shield where a note exists), and person contact names in Pre-plans Due for Review. Workflow Health never shows run error details. When a revealable value is on the board, the header shows Protected data hidden - Verify to reveal, which uses the same step-up as every other page; revealed widgets carry a Revealed badge, the reveal covers the whole page, every reveal is audited, and it ends when the department's verification window expires or the member presses Conceal. Message subjects and notes need View protected operational data (default: department and group admins); contact names need View protected contact data (default: department admins). A value the member's role cannot view shows Your role can't view this, and a member who can reveal nothing is never asked to verify; with the default permissions a member cannot read the subjects of their own messages in the Inbox widget, exactly as on the Inbox page. Wall display never reveals.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dashboard-data-protection",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-31T00:00:00Z"
    },
    {
      "Id": "dashboard-classic",
      "Locale": "en",
      "TitleKey": "Topic.dashboard-classic",
      "Body": "Turning on the new dashboard and returning to classic The widget dashboard is controlled by the Dashboard.Modern feature flag, evaluated per department and seeded off. Hosted departments ask Resgrid support to switch it on; self-hosted operators run Resgrid.Console --FeatureFlags --Key=Dashboard.Modern --DepartmentId=1 --On for one department, or without the department for everyone. While it is off every member sees the classic dashboard: the personnel status table, the Actions and Staffing Level panels and Department Info. While it is on, a member can choose More dashboard options, then Use the classic dashboard; the choice is saved per member per department and their boards are kept, and the classic page then shows a banner with Try the new dashboard. /User/Home/Dashboard?classic=true opens the classic page once without changing the choice, and if JavaScript is off or the dashboard cannot load the page links to the classic dashboard. Turning the flag off loses no saved boards. Admins can prepare a department default at /User/Dashboard/Templates before turning the flag on.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dashboard-classic",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-31T00:00:00Z"
    },
    {
      "Id": "profile",
      "Locale": "en",
      "TitleKey": "Feature.profile",
      "Body": "My Profile Your own profile, contact details and notification preferences. Most members use Resgrid through the Responder app. Getting everyone installed and signed in is what lets dispatches reach them. Members install the Responder app, a tablet in Engine 1 runs the Unit app and a station screen shows the Big Board. Decide which devices each role will use and share the app download links with your members.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "profile",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "departments",
      "Locale": "en",
      "TitleKey": "Feature.departments",
      "Body": "Your Departments Switch between the departments you belong to. Most members use Resgrid through the Responder app. Getting everyone installed and signed in is what lets dispatches reach them. Members install the Responder app, a tablet in Engine 1 runs the Unit app and a station screen shows the Big Board. Decide which devices each role will use and share the app download links with your members.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "departments",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "guide.start-setup",
      "Locale": "en",
      "TitleKey": "Guide.start-setup",
      "Body": "Department administrators can open **Admin Assist** from the top of the Department menu when setup is enabled for the deployment. It opens on **Setup Wizard**, with **Setup Report**, **Explore Resgrid & Addons** and **Admin AI** beside it. An unfinished setup also appears on the dashboard. Dismissing that prompt affects only your account; the menu remains available. Setup Wizard, Setup Report and Explore do not require Admin AI or an AI add-on; the Admin AI tab stays disabled until Admin AI is enabled for the department.\n\nChoose **Fresh setup**, **Review existing setup**, or **Import or migration**. The choice records your intent; it does not import or overwrite data. Use the department operating profile to describe your organization and link approved local policies. Fire, EMS, mental health, SAR, emergency response, Hazmat, industrial, security and mutual-aid packs suggest areas to review. They do not establish qualifications or authorize clinical, tactical or hazardous work.\n\nThe nine-step journey covers goals and applications, the department profile, all-area orientation, people and access, operational essentials, selected workflows, add-ons, verification and practice, and review and handover. Pause and resume without creating sample incidents or overwriting existing configuration.\n\nSelected operating packs suggest areas without changing your choices. Site references use existing department group IDs; policy references use existing, unexpired department document IDs. Saving checks those references and rejects concurrent overwrites. A valid reference does not prove that its contents are approved or sufficient. Verification checks whether linked policies or site groups later become unavailable, and flags documents scheduled for removal within 30 days. A reviewed profile without a continuity link receives an administrative review prompt; an external procedure may still exist. The checks do not read or certify policy contents.\n\nAn optional **Expected email polling interval** compares recorded mailbox polls with your declared maximum interval. Leave it blank when no interval has been established. Missing or future poll timestamps remain unknown, and low call volume alone does not imply failure. SMS, CAD push and API intake require separate telemetry; the expectation does not change polling or send a test.",
      "SourcePath": "docs/admin-assist/setup-guide.md",
      "Anchor": "start-setup",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "guide.choose-areas",
      "Locale": "en",
      "TitleKey": "Guide.choose-areas",
      "Body": "Mark each area **Use now**, **Learn later**, or **Not applicable**. A not-applicable choice requires a reason: outside the mission, managed in another approved system, managed by a responsible partner, or no current need. Baseline security remains in scope. Explore Resgrid covers applications, calls, people, units and location, communication, contacts and site knowledge, records, maintenance, inventory, deployments and business, automation, security and plans. Each feature explains its purpose, value, example and adoption requirements.\n\nArea choices are shared by department administrators. Learning and interest choices are personal. Another administrator's save can require you to reload and review before saving again. Learning a feature does not configure it, purchase an add-on, enable a module or send anything.",
      "SourcePath": "docs/admin-assist/setup-guide.md",
      "Anchor": "choose-areas",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "guide.configure-and-verify",
      "Locale": "en",
      "TitleKey": "Guide.configure-and-verify",
      "Body": "Use **Open owning screen** to configure a feature with its existing permissions and validation. Some settings include contextual help and a highlighted field when opened from Admin Assist. Save on that screen, then use **Return to setup and verify**. The return link does not submit the form. Its navigation context lasts 30 minutes and is tied to the current administrator and department, so it can survive the owning screen’s save and redirect. Returning to setup clears it. Choose **Verify again** after saving.\n\nThe report separates verified checks, failures and unknown evidence. Unpurchased optional add-ons do not reduce core completion. Deferring an area does not hide a verified critical failure or uncertainty in an active critical check. Selected areas with no automated checks are listed explicitly; they are not verified. Missing, restricted or unavailable source data remains unknown; it is never treated as zero. Critical unknowns prevent a fully verified result. Review the evidence time and refresh again if configuration changed during the read.\n\nRecord an administrative review to retain the report version, evidence revision, selected-scope revision, timestamp and unresolved-check counts. A changed configuration, scope or catalog makes that review visibly out of date. Each newly added administrator still has a separate orientation checklist. An optional revisit date is stored in the report; it does not schedule a one-off notification. Weekly follow-up is a separate preference.\n\nSetup Report replaces the old numerical setup score. It is administrative configuration guidance, not certification of operational readiness or proof that a page was delivered. Start a Communication Test explicitly through its own screen when communication verification is needed.\n\n**Open a fresh printable report** rechecks access and reloads the summary. It includes current findings, selected areas, personal feature interests and public add-on guidance. It omits protected notes, names, source records and credentials. Printing or saving a local copy does not create a managed server export; handle the copy under department policy.",
      "SourcePath": "docs/admin-assist/setup-guide.md",
      "Anchor": "configure-and-verify",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "guide.understand-addons",
      "Locale": "en",
      "TitleKey": "Guide.understand-addons",
      "Body": "| Add-on | What it adds | Adoption considerations |\n|---|---|---|\n| Push-to-Talk | Voice channels in supported Resgrid clients | Review seats, devices and channel membership. Phone voice alerts and radio requirements are separate. |\n| Advanced Data Protection | Additional protection and scoped disclosure for supported sensitive content | Purchase and enrollment are separate. Review MFA, recovery, supported fields and effects on search, exports and integrations. |\n| Readiness Pro | Maintenance, work orders, preventive and corrective work, approvals and safety holds | Checklists remain available without the add-on. Maintenance also needs its module and permissions. |\n| Business Operations | Invoicing, rates, contracts, bids, reimbursement and workforce costing | Certifications and Deployment Finance remain available without the add-on. Pay-data reporting also requires enabled ADP; payment providers need separate setup. |\n| Enhanced AI | Planned summaries, drafts, knowledge assistance and optional conversation | Availability depends on release and rollout. Deterministic setup and Admin Assist do not require it. |\n\nAvailability can depend on subscription, rollout, module settings, permissions, protection enrollment and source availability. An unknown subscription is not confirmation of a free or paid plan. Only the managing member can perform subscription changes through the billing screen. Feature interest does not start a trial or purchase.\n\nThe add-on step opens a comparison of all five add-ons. Each card lists its related features. Mark a feature **Interested in this feature** to see it in Setup Report with its current prerequisites and next available action. **I understand this feature**, availability, purchased entitlement, configuration and verified checks are separate states. Buying an add-on does not configure or verify the feature. The feature-setup section distinguishes recorded configuration, supported check results, current entitlement and optional opportunities. Initial evidence mappings cover personnel, groups, units, run cards, check-in timers, weather zones and email intake. Other feature configuration remains unassessed; absence of setup evidence does not prove a feature is unused.",
      "SourcePath": "docs/admin-assist/setup-guide.md",
      "Anchor": "understand-addons",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "guide.follow-up",
      "Locale": "en",
      "TitleKey": "Guide.follow-up",
      "Body": "Admin Assist adds an administrative worklist. Claim an unresolved finding, set a review date, start a review, or record an accepted exception with a reason and expiry. Exceptions do not make the underlying check pass. Fresh verification resolves a finding; a later verified failure reopens it. An evidence outage cannot resolve it. Fix records, qualifications, inventory and other source tasks through their owning screens.\n\nWeekly follow-up is opt-in and only runs when the deployment enables scheduled digests. Quiet hours use the department time zone. The message contains a generic link to Admin Assist; open the authenticated page to see current evidence. A notification handoff is not confirmation of delivery. Turning the preference off suppresses future handoffs.",
      "SourcePath": "docs/admin-assist/setup-guide.md",
      "Anchor": "follow-up",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "guide.reference-and-history",
      "Locale": "en",
      "TitleKey": "Guide.reference-and-history",
      "Body": "Settings Reference searches a release-pinned public documentation catalog. It does not search department records or attachments. If your language has no reference article, the result labels its source language.\n\nSupported scalar settings offer **Preview a proposed value**. A preview compares values in memory, shows related health-check changes and lists its limits. It does not save configuration. Current operational previews cover v4 map-marker selection, the automatic-availability status projection and administrator MFA enrollment. These do not establish every client's behavior, actual physical availability or session/recovery readiness.\n\n**Preview plan capacity** compares proposed total personnel and unit counts with observed base-plan headroom. It does not purchase capacity or add resources; add-on seats, provider quotas and pricing are separate.\n\n**Preview dispatch routing** uses a saved call ID as a route scenario. Choose an explicit UTC roster time within seven days of now and all three proposed shift/crew/group options. It compares direct, group, role and unit crew/group recipients with the broadcaster's resolver, preserving direct duplicates and empty-shift fallback. Current membership and crews are not reconstructed historical assignments. Unit devices, printers, channel eligibility, provider handoff and delivery are outside these personnel counts. The preview sends nothing and rereads inputs to detect changes during evaluation.\n\n**Preview a permission change** compares current members through the supported action or resource visibility gate. It includes roles, department and group administration, target-group ancestors, and ungrouped targets. It counts allowed actor/target pairs separately from members, so a narrowed group scope is visible even when the same members retain some access. Existing sessions, protected fields and other permission gates still require verification.\n\n**Preview a module switch** compares web navigation and bounded primary-table counts. Hiding an entry keeps the underlying data; it does not prove API access is revoked or a worker stops. Mapping, Reports, Logs/Records and Inventory data totals remain unknown where a complete adapter is unavailable. Licensed maintenance, checklists and business switches require separate entitlement-aware previews.\n\n**Preview a text sender scenario** compares a test number against current source patterns and the complete proposed call/command switches. Choose the provider path actually in use. The result returns a masked reference and distinguishes routing branches from actual successful acceptance. SignalWire and Twilio legacy paths share their production routing decisions with the preview, but do not consult the switches uniformly. Chatbot and master-number paths, number ownership, active SMS department, plan access, webhook authentication, verified identity, opt-out exceptions and parser success require separate verification. A missing dispatch-source pattern is not proof that verified members cannot use commands. The preview never receives or sends a text.\n\n**Preview notification volume** compares the current staffing-suppression setting with a proposed toggle for a declared department-wide scenario. Set the future window and assumed events per member across that entire window. The result separates current membership, preference/contact gates, confirmed suppression, unknown profiles/staffing and possible channel-handoff ranges. It uses no historical event sample and does not resolve every notification-rule audience. Address/device validity, provider behavior, chat/voice, SMS segments and delivery remain separate. Changing this preview never saves settings, sends a notification or changes staffing.\n\n**Preview sign-in and session policy** compares department-wide MFA, SSO-only policy, password age/minimum length, idle timeout or concurrent-session limits. Enrollment is distinct from verified factors and recovery. The SSO-only gate keeps its existing safety valve when no provider is enabled; an enabled provider is not a successful login test. Session estimates respect the host policy date and distinguish next-session limits from revocation. Password age uses the owning boundary and preserves its handling of untracked dates. No password, recovery secret, session ticket, IP address or provider credential is read by these projections, and the preview does not change credentials or sessions.\n\n**Preview retention policy** compares a prospective Records default using a bounded sample of metadata. A blank default uses the system class default; zero means permanent. Historical policy and definition overrides remain in force, so older revisions do not simply inherit a shortened default. Known parent/preservation holds and permanent-content obligations are excluded; uncertain historical holds are identified. Remaining candidates need the owning lifecycle checks for children, disclosure copies, attachments, external storage, evidence, submissions, workflows and search erasure. These counts are not permission or proof of eligibility to purge. The preview does not read record bodies, purge content, change protection or cancel an add-on.\n\nCounts and checks are only as current as their source evidence. Unquantified effects still need review on the owning screen. Refresh after a configuration conflict and verify again after an actual save. Reference results can expand the full release-pinned source text and identify its source language.\n\nChange History starts when collection is enabled. Earlier changes are unavailable. History shows safe configuration differences; secrets and sensitive strings use presence/change markers. It does not expose another administrator's personal learning choices.",
      "SourcePath": "docs/admin-assist/setup-guide.md",
      "Anchor": "reference-and-history",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    }
  ]
}
