    {
      "Id": "dispatch-app",
      "Locale": "en",
      "TitleKey": "Feature.dispatch-app",
      "Body": "Dispatch application The dispatcher view for creating and managing calls. Give dispatch personnel a focused operating surface alongside web administration. Members install the Responder app, a tablet in Engine 1 runs the Unit app and a station screen shows the Big Board. Give dispatch access to the people who dispatch, then have them sign in.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dispatch-app",
      "PackVersion": "2026.09.25.2",
