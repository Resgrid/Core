    {
      "Id": "incident-command",
      "Locale": "en",
      "TitleKey": "Feature.incident-command",
      "Body": "Incident command and accountability Incident command and accountability for incident commanders. Prepare command structures and access before an exercise or response. Members install the Responder app, a tablet in Engine 1 runs the Unit app and a station screen shows the Big Board. Give command access to the officers who run incidents.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "incident-command",
      "PackVersion": "2026.09.25.2",
