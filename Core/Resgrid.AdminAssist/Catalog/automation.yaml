      "Body": "New Workflow Create an automation workflow. Automate repeated administrative steps and connect Resgrid to the other systems you use. A workflow posts new calls to a team channel, and a custom field records the fire district on each call. Have the destination systems and credentials ready, and decide who owns each automation.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
