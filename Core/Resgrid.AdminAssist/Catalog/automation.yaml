    {
      "Id": "import-migration",
      "Locale": "en",
      "TitleKey": "Feature.import-migration",
      "Body": "Import & Migration Bring people, stations, apparatus and settings into Resgrid from spreadsheets or the system you are leaving. Start a workspace, download the Resgrid starter workbook or upload your own export, match columns and values, and fix the issues the checks find. Nothing is saved until you review and approve an import; every import is journaled and can be rolled back for 30 days. Imported people stay dormant (they cannot sign in and receive nothing) until you invite them from Verify & activate, and Admin Assist then verifies the result in Setup Report.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "import-migration",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-12T00:00:00Z"
    },
    {
