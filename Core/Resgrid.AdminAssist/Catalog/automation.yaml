      "Locale": "en",
      "TitleKey": "Setting.DepartmentImportConfig",
      "Body": "Import & Migration settings How long uploaded files and checked data are kept and how imports are approved. Uploaded files are kept 7 days after a successful import (72 hours with Advanced Data Protection) and 30 days after a failure; checked data is kept 30 days after go-live because rollback needs it. A rollback is possible until go-live plus 30 days for a new department, and for 30 days after the import in a live department. Require a second administrator to have every import approved by two different people. Add only never changes existing records; Review updates changes only the fields approved in the preview.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-departmentimportconfig",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-12T00:00:00Z"
    },
    {
      "Id": "import-dormant-members",
      "Locale": "en",
      "TitleKey": "Rule.import-dormant-members",
      "Body": "Dormant imported members People created by an import are dormant: they cannot sign in, receive no dispatches, messages or reminders, and are left out of every notification sweep until you invite them. Already-expired certifications are imported as expired so nobody is emailed, and reminders for certifications expiring soon wait until the holder is invited. Invite people from Verify & activate; invitations go out in small batches outside night hours, and accepting one lets the person choose a password. People who already have a Resgrid account in another department get an invitation to join instead.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "import-dormant-members",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-12T00:00:00Z"
    },
    {
      "Id": "import-support-access",
      "Locale": "en",
      "TitleKey": "Field.DepartmentImportConfig.SupportGrantDefaultDays",
      "Body": "Support access for imports Resgrid support sees nothing in an import workspace unless an administrator grants access, for a limited time, at one of four levels: Observe (progress, counts and issue codes), Inspect (also sample values to diagnose a problem), Prepare (also fix mappings and values as drafts the department approves) and Operate (staff run the import, with two-person control, only under an agreed managed migration). Every staff action is logged on the workspace timeline, and access can be revoked at any time.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "import-support-access",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-12T00:00:00Z"
    }
  ]
