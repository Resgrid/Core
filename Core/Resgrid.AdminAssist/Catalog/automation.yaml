  "Articles": [
    {
      "Id": "workflows",
      "Locale": "en",
      "TitleKey": "Feature.workflows",
      "Body": "Workflows Automations triggered by department events. Automate repeated administrative steps and connect Resgrid to the other systems you use. A workflow posts new calls to a team channel, and a custom field records the fire district on each call. Start with one workflow for a task you repeat, and review its runs.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "workflows",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "user-defined-fields",
      "Locale": "en",
      "TitleKey": "Feature.user-defined-fields",
      "Body": "User-defined fields Custom fields on calls, personnel and other records. Collect the information the department actually needs with appropriate classification. A workflow posts new calls to a team channel, and a custom field records the fire district on each call. Add only the fields you must capture.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "user-defined-fields",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "api-mcp",
      "Locale": "en",
      "TitleKey": "Feature.api-mcp",
      "Body": "API and MCP integrations API and MCP access for other systems. Connect approved systems without placing credentials in setup examples. A workflow posts new calls to a team channel, and a custom field records the fire district on each call. Create credentials for each integration and limit what they can access.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "api-mcp",
      "PackVersion": "2026.09.25.2",
