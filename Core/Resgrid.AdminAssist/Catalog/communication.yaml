      "Body": "Department Notification / Lock To Group. Restricts applicable event processing to group scope. Review the selected event's actual source group and recipient resolver.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-locktogroup",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.SelectedGroupsAdminsOnly",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.SelectedGroupsAdminsOnly",
      "Body": "Department Notification / Selected Groups Admins Only. Limits selected-group recipients to their administrators in supported event paths. It does not designate department administrators automatically.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-selectedgroupsadminsonly",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.DepartmentAdmins",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.DepartmentAdmins",
      "Body": "Department Notification / Department Admins. Includes department administrators in supported notification processing. Review overlap and channel eligibility before estimating volume.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-departmentadmins",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.Everyone",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.Everyone",
      "Body": "Department Notification / Everyone. Selects the department-wide recipient option. Review actual active membership, suppression and deduplication before use.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-everyone",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.Disabled",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.Disabled",
      "Body": "Department Notification / Disabled. Stored disabled marker. The inspected legacy notification processor does not consult this flag, so it must not be treated as a verified stop switch. Review the active consumer; queued and delivered notifications cannot be recalled.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-disabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.BeforeData",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.BeforeData",
      "Body": "Department Notification / Before Data. Previous-state filter for applicable events. Review valid status IDs and the event-specific interpretation of an empty or wildcard value.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-beforedata",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.CurrentData",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.CurrentData",
      "Body": "Department Notification / Current Data. Current-state filter for applicable events. Compare it with the previous-state filter to avoid unintended volume.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-currentdata",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.UpperLimit",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.UpperLimit",
      "Body": "Department Notification / Upper Limit. Upper threshold for event-specific alerts. Units and comparisons depend on the selected event.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-upperlimit",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.LowerLimit",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.LowerLimit",
      "Body": "Department Notification / Lower Limit. Lower threshold for event-specific alerts. Use approved local thresholds and verify the actual event interpretation.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-lowerlimit",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentNotification.Data",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentNotification.Data",
      "Body": "Department Notification / Data. Event-specific configuration payload. The owning editor validates its meaning; Admin Assist does not execute arbitrary stored expressions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentnotification-data",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.IsEnabled",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.IsEnabled",
      "Body": "Chatbot Department Config / Is Enabled. Department chatbot availability. Platform feature rollout, account linking and action permissions are separate gates.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-isenabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.AllowedPlatforms",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.AllowedPlatforms",
      "Body": "Chatbot Department Config / Allowed Platforms. Allowed chatbot platform codes; the stored asterisk represents the platform default. Review each connected provider and its account-linking requirements.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-allowedplatforms",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.MaxSessionsPerUser",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.MaxSessionsPerUser",
      "Body": "Chatbot Department Config / Max Sessions Per User. Maximum chatbot sessions per member in supported consumers. This is separate from authenticated web/mobile session limits.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-maxsessionsperuser",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.SessionTtlMinutes",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.SessionTtlMinutes",
      "Body": "Chatbot Department Config / Session TTL Minutes. Chatbot session lifetime in minutes. Expiry does not revoke an unrelated Resgrid sign-in session.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-sessionttlminutes",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.AllowDispatchViaChatbot",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.AllowDispatchViaChatbot",
      "Body": "Chatbot Department Config / Allow Dispatch Via Chatbot. Permits supported chatbot dispatch actions subject to their own authorization and confirmation. Enabling it may allow real calls and pages.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-allowdispatchviachatbot",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.RequireConfirmationForStatusChange",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.RequireConfirmationForStatusChange",
      "Body": "Chatbot Department Config / Require Confirmation For Status Change. Requests confirmation for supported status changes. Review each platform consumer before assuming all commands are covered.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-requireconfirmationforstatuschange",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.LlmApiEndpoint",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.LlmApiEndpoint",
      "Body": "Chatbot Department Config / LLM API Endpoint. Optional existing chatbot model endpoint. Phase 0 Admin Assist does not call it and does not use chatbot configuration as an AI entitlement.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-llmapiendpoint",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.LlmApiKey",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.LlmApiKey",
      "Body": "Chatbot Department Config / LLM API Key. Credential for the chatbot model provider. Never copy it into setup metadata or public reference content.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-llmapikey",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.LlmModelName",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.LlmModelName",
      "Body": "Chatbot Department Config / LLM Model Name. Model identifier used by the existing chatbot integration. This is separate from the later Admin Assist open-source inference deployment.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-llmmodelname",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.MessagesPerUserPerMinute",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.MessagesPerUserPerMinute",
      "Body": "Chatbot Department Config / Messages Per User Per Minute. Optional per-member chatbot rate bound. Review provider limits and burst behavior; this is not a delivery guarantee.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-messagesperuserperminute",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.MessagesPerDepartmentPerMinute",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.MessagesPerDepartmentPerMinute",
      "Body": "Chatbot Department Config / Messages Per Department Per Minute. Optional department chatbot rate bound. Consider shared demand and provider quotas before changing it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-messagesperdepartmentperminute",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.RequireLinkingConfirmation",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.RequireLinkingConfirmation",
      "Body": "Chatbot Department Config / Require Linking Confirmation. Requires confirmation in the supported account-linking flow. Linking must not bypass verified identity or departmental authorization.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-requirelinkingconfirmation",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.ChatbotDepartmentConfig.ProactiveNotificationsEnabled",
      "Locale": "en",
      "TitleKey": "TableField.ChatbotDepartmentConfig.ProactiveNotificationsEnabled",
      "Body": "Chatbot Department Config / Proactive Notifications Enabled. Allows supported proactive chatbot notifications. Recipient permissions, channel configuration and sending workflows remain authoritative.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-chatbotdepartmentconfig-proactivenotificationsenabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "notifications",
      "Locale": "en",
      "TitleKey": "Feature.notifications",
      "Body": "Notification rules Rules that alert chosen people when calls, statuses or other events happen. Reduce missed follow-up and review unnecessary message volume. An administrator creates notification rules for new calls, builds an Officers distribution list and runs a communication test before going live. Create notification rules for the events officers and administrators need to know about.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "notifications",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "distribution-lists",
      "Locale": "en",
      "TitleKey": "Feature.distribution-lists",
      "Body": "Distribution lists Reusable recipient lists, including email lists. Keep audience ownership explicit and review recipients before sending. An administrator creates notification rules for new calls, builds an Officers distribution list and runs a communication test before going live. Create lists for groups you message often, such as Officers.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "distribution-lists",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "communication-tests",
      "Locale": "en",
      "TitleKey": "Feature.communication-tests",
      "Body": "Communication Tests Test messages that show whether members can be reached. Collect observed test evidence; registration alone does not prove delivery. An administrator creates notification rules for new calls, builds an Officers distribution list and runs a communication test before going live. Run a communication test before going live and after major changes.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "communication-tests",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "chat",
      "Locale": "en",
      "TitleKey": "Feature.chat",
      "Body": "Chat Team chat for members. A dispatch only helps if it reaches people. This is where you confirm members can actually be contacted. An administrator creates notification rules for new calls, builds an Officers distribution list and runs a communication test before going live. Create channels for your teams once chat is enabled.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "chat",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "inbox",
      "Locale": "en",
      "TitleKey": "Feature.inbox",
      "Body": "Inbox Messages sent to you. A dispatch only helps if it reaches people. This is where you confirm members can actually be contacted. An administrator creates notification rules for new calls, builds an Officers distribution list and runs a communication test before going live. Make sure members have added a mobile number or email address and installed the Responder app.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "inbox",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "outbox",
      "Locale": "en",
      "TitleKey": "Feature.outbox",
      "Body": "Sent Messages Messages you have sent. A dispatch only helps if it reaches people. This is where you confirm members can actually be contacted. An administrator creates notification rules for new calls, builds an Officers distribution list and runs a communication test before going live. Make sure members have added a mobile number or email address and installed the Responder app.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "outbox",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "compose-message",
      "Locale": "en",
      "TitleKey": "Feature.compose-message",
      "Body": "New Message Send a message, poll or callback request to members. A dispatch only helps if it reaches people. This is where you confirm members can actually be contacted. An administrator creates notification rules for new calls, builds an Officers distribution list and runs a communication test before going live. Make sure members have added a mobile number or email address and installed the Responder app.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "compose-message",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "chatbot-settings",
      "Locale": "en",
      "TitleKey": "Feature.chatbot-settings",
      "Body": "Chatbot and Assistant integration settings Connect the Resgrid Assistant to chat platforms and choose what it may do. Keep automated access and confirmations under administrator control. An administrator creates notification rules for new calls, builds an Officers distribution list and runs a communication test before going live. Make sure members have added a mobile number or email address and installed the Responder app.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "chatbot-settings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    }
  ]
