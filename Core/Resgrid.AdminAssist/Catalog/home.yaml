      "Locale": "en",
      "TitleKey": "Feature.unit-app",
      "Body": "Unit application A shared unit client represents an apparatus or team rather than an individual member. Review device identity, assigned crew and unit communications together. A dispatcher creates a call while responders and unit crews receive their assigned work. Review the owning screen, current access and source-specific requirements. Configuration, provisioning, exports and messages require explicit actions; learning about a capability does not activate it.",
