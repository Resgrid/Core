    {
      "Id": "big-board",
      "Locale": "en",
      "TitleKey": "Feature.big-board",
      "Body": "Big Board Shared display clients show the configured resource and call picture. Choose display refresh, location age and visibility appropriate to a station screen. A dispatcher creates a call while responders and unit crews receive their assigned work. Review the owning screen, current access and source-specific requirements. Configuration, provisioning, exports and messages require explicit actions; learning about a capability does not activate it.",
