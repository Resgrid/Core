  "Articles": [
    {
      "Id": "module.IncidentBackOfficeDisabled",
      "Locale": "en",
      "TitleKey": "Module.IncidentBackOfficeDisabled",
      "Body": "Incident Back Office availability. Controls availability of the Incident Back Office desks. Disabling this module removes them from navigation and blocks their operations; it does not delete activations or their records. Turning it on still requires the Incident Back Office add-on, rollout and permissions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-incidentbackofficedisabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "module.IncidentBusinessDisabled",
      "Locale": "en",
      "TitleKey": "Module.IncidentBusinessDisabled",
      "Body": "Incident finance availability. Controls the incident finance desks: procurement, budget, time, cost, claims, recovery, intake and closeout. Disabling it hides those desks and blocks their operations without deleting their records. It only applies while the Incident Back Office is on, and turning it on still requires the Incident Business rollout and permissions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-incidentbusinessdisabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "module.IncidentCoordinationDisabled",
      "Locale": "en",
      "TitleKey": "Module.IncidentCoordinationDisabled",
      "Body": "Coordination boards availability. Controls coordination boards and the situation desk. Disabling it hides them and blocks their operations without deleting boards or their items. It only applies while the Incident Back Office is on, and turning it on still requires the Incident Coordination rollout and permissions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-incidentcoordinationdisabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentBackOfficeDefaults",
      "Locale": "en",
      "TitleKey": "Setting.IncidentBackOfficeDefaults",
      "Body": "Incident Back Office defaults. Defaults for new activations: how old an incident command or dispatch source may get before its tiles grey out, the currency and measurement system (blank uses the department's country), the length of an operational period, and whether exercises may notify external participants and vendors.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentbackofficedefaults",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentEnrollmentPolicy",
      "Locale": "en",
      "TitleKey": "Setting.IncidentEnrollmentPolicy",
      "Body": "Incident enrollment policy. How people and units seen on an incident become participants (the enrollment mode), whether people not yet enrolled are counted as a separate band in feeding, sleeping and water forecasts, and how long or old the enrollment queue may get before an alert is raised.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentenrollmentpolicy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentNotificationRouting",
      "Locale": "en",
      "TitleKey": "Setting.IncidentNotificationRouting",
      "Body": "Incident notification routing. Which incident positions receive each Incident Back Office notice. Positions are resolved to their current holders when the notice is sent; a notice with no positions configured uses its built-in default positions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentnotificationrouting",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentForecastPolicy",
      "Locale": "en",
      "TitleKey": "Setting.IncidentForecastPolicy",
      "Body": "Incident forecast policy. Coefficients and alert windows for logistics forecasts: meal and water contingency, drinking water per person per day, bed reserve, whether predicted timeouts reduce forecasts, replacement lead time, the arrival, timeout and meal cutoff lead windows, and the facility capacity and water days-of-supply thresholds.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentforecastpolicy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentAssignmentRulePolicy",
      "Locale": "en",
      "TitleKey": "Setting.IncidentAssignmentRulePolicy",
      "Body": "Incident assignment rules. The work/rest rule pack and assignment limits used to flag people who are reaching their limits: maximum assignment days, travel days, maximum extension, maximum work hours per shift and the rest required per hour worked.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentassignmentrulepolicy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentVendorPolicy",
      "Locale": "en",
      "TitleKey": "Setting.IncidentVendorPolicy",
      "Body": "Incident vendor policy. How often vendors must be verified again, how long a capacity hold lasts, and how far ahead expiring compliance documents and capacity holds are flagged.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentvendorpolicy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentSelfServicePolicy",
      "Locale": "en",
      "TitleKey": "Setting.IncidentSelfServicePolicy",
      "Body": "Incident self-service policy. Self-service links for participants and vendors: how many days a link stays valid after the assignment or engagement ends, whether a one-time code is required before lodging or travel details are shown, and whether vendor links need a verified vendor contact.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentselfservicepolicy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentFinancePolicy",
      "Locale": "en",
      "TitleKey": "Setting.IncidentFinancePolicy",
      "Body": "Incident finance policy. Finance controls: single-person operation (one person may request, approve, commit, receive and accept only with a recorded acknowledgment), extra sender domains for the intake inbox, the budget, agreement ceiling and daily burn thresholds, intake backlog limits, claim and recovery deadline warnings, the split-purchase window and the micro-purchase threshold.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentfinancepolicy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.IncidentRetentionPolicy",
      "Locale": "en",
      "TitleKey": "Setting.IncidentRetentionPolicy",
      "Body": "Incident retention policy. How long operational snapshots are kept after an incident closes, how many years ledger entries are kept, and how long expired self-service links are kept. Incident records follow Records retention instead.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-incidentretentionpolicy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "setting.CoordinationBoardDefaults",
      "Locale": "en",
      "TitleKey": "Setting.CoordinationBoardDefaults",
      "Body": "Coordination board defaults. Defaults for coordination boards: when an item counts as stale, whether road closures and shelter capacity raise alarms, how many days a board share lasts, and how far ahead a due item is flagged.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-coordinationboarddefaults",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "incident-activation",
      "Locale": "en",
      "TitleKey": "Feature.incident-activation",
      "Body": "Incident activation and command Open an activation for a large incident, planned event or exercise and follow it from the command desk. Run the support side of a large incident from one activation: who is on it, where they sleep and eat, what was ordered and what it cost. A wildfire activation checks in arriving strike teams, books their lodging and meals, and tracks every purchase against the incident budget. Review the Incident Back Office settings, then open an exercise activation.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "incident-activation",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "incident-planning",
      "Locale": "en",
      "TitleKey": "Feature.incident-planning",
      "Body": "Planning, organization and check-in Operational periods and plan versions, the incident organization and positions, participants and check-in. Run the support side of a large incident from one activation: who is on it, where they sleep and eat, what was ordered and what it cost. A wildfire activation checks in arriving strike teams, books their lodging and meals, and tracks every purchase against the incident budget. Build your position catalog and team rosters, then check participants in during an exercise.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "incident-planning",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "incident-logistics",
      "Locale": "en",
      "TitleKey": "Feature.incident-logistics",
      "Body": "Incident logistics Resource requests, facilities, lodging, feeding, water and support services, with vendors and the support plan. Run the support side of a large incident from one activation: who is on it, where they sleep and eat, what was ordered and what it cost. A wildfire activation checks in arriving strike teams, books their lodging and meals, and tracks every purchase against the incident budget. Add your lodging, feeding, water and transport vendors, then review the forecast policy.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "incident-logistics",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-26T00:00:00Z"
    },
    {
      "Id": "incident-finance",
      "Locale": "en",
      "TitleKey": "Feature.incident-finance",
