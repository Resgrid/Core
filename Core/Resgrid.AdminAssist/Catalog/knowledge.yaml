    {
      "Id": "setting.ProtocolLibrarySettings",
      "Locale": "en",
      "TitleKey": "Setting.ProtocolLibrarySettings",
      "Body": "Protocol Library Settings. Department-wide rules on the Protocols Settings page: whether approvals need a passkey and read-and-sign a step-up, the review interval new protocols start with, and how long superseded and retired versions are kept, with a legal hold that stops any deletion. Missing means the standard signature levels, no default interval and every version kept. Only department administrators can change it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-protocollibrarysettings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "field.ProtocolLibrarySettings.RequirePasskeyForApproval",
      "Locale": "en",
      "TitleKey": "Field.ProtocolLibrarySettings.RequirePasskeyForApproval",
      "Body": "Protocol Library Settings / Require Passkey for Approval. Approvals and \"reviewed, no change\" stamps must be signed with a passkey; a step-up by authenticator code or sign-in provider is no longer enough. Approvers without a registered passkey cannot sign until they add one. Off, any fresh step-up or passkey signs.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocollibrarysettings-requirepasskeyforapproval",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "field.ProtocolLibrarySettings.ReadAndSignRequiresStepUp",
      "Locale": "en",
      "TitleKey": "Field.ProtocolLibrarySettings.ReadAndSignRequiresStepUp",
      "Body": "Protocol Library Settings / Read-and-Sign Requires Step-Up. Read-and-sign acknowledgments will need a fresh step-up instead of the signed-in session alone. Read-and-sign is not available yet; the choice is saved for when it is.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocollibrarysettings-readandsignrequiresstepup",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "field.ProtocolLibrarySettings.DefaultReviewIntervalDays",
      "Locale": "en",
      "TitleKey": "Field.ProtocolLibrarySettings.DefaultReviewIntervalDays",
      "Body": "Protocol Library Settings / Default Review Interval Days. Days between reviews for new and imported protocols that do not set their own interval, 0 to 3650; 0 sets none. Existing protocols keep theirs. Publishing a version or recording \"reviewed, no change\" restarts the interval, and the protocol's owner, or the department administrators when it has none, is reminded 30 and 7 days before a review is due and again when it is overdue.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocollibrarysettings-defaultreviewintervaldays",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "field.ProtocolLibrarySettings.LegalHold",
      "Locale": "en",
      "TitleKey": "Field.ProtocolLibrarySettings.LegalHold",
      "Body": "Protocol Library Settings / Legal Hold. A department-wide legal hold: while it is on, no superseded or retired protocol version is deleted, whatever the retention days. An approver can also hold a single protocol from its edit page.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocollibrarysettings-legalhold",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "field.ProtocolLibrarySettings.DefaultContentLocale",
      "Locale": "en",
      "TitleKey": "Field.ProtocolLibrarySettings.DefaultContentLocale",
      "Body": "Protocol Library Settings / Content Language. The language protocols are written in. Members whose language has no approved translation of a version read it in this language, and block labels such as Caution are written in it. Blank means English.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocollibrarysettings-defaultcontentlocale",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.ProtocolLibrarySettings.ShowDeterminantInDispatch",
      "Locale": "en",
      "TitleKey": "Field.ProtocolLibrarySettings.ShowDeterminantInDispatch",
      "Body": "Protocol Library Settings / Determinant in dispatch texts. Adds the determinant and the protocol name of a call's case flow to the dispatch push title, the dispatch text message and the voice dispatch prompt. Off by default; with it off every dispatch text is as before.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocollibrarysettings-showdeterminantindispatch",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.ProtocolLibrarySettings.Retention",
      "Locale": "en",
      "TitleKey": "Field.ProtocolLibrarySettings.Retention",
      "Body": "Protocol Library Settings / Retention. Days each protocol kind (Dispatch, SOG, Clinical Guideline, Policy, Procedure, Reference) keeps a version after it is superseded or retired, up to 36500; after that a background job deletes it. 0 keeps that kind's versions. A version still attached to a call is never deleted, and nothing is deleted while a legal hold is on.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocollibrarysettings-retention",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "field.ProtocolKindRetention.Kind",
      "Locale": "en",
      "TitleKey": "Field.ProtocolKindRetention.Kind",
      "Body": "Protocol Kind Retention / Kind. The protocol kind the entry applies to: 0 Dispatch, 1 SOG, 2 Clinical Guideline, 3 Policy, 4 Procedure, 5 Reference. One entry per kind; a kind without an entry keeps every version.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocolkindretention-kind",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "field.ProtocolKindRetention.KeepDays",
      "Locale": "en",
      "TitleKey": "Field.ProtocolKindRetention.KeepDays",
      "Body": "Protocol Kind Retention / Keep Days. Days after a version of that kind is superseded or retired before it may be deleted, 1 to 36500. An entry of 0 is dropped when saved, so the kind keeps its versions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-protocolkindretention-keepdays",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "contacts",
      "Locale": "en",
      "TitleKey": "Feature.contacts",
      "Body": "Contacts Shared contacts such as hospitals, agencies and vendors. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Add the outside contacts members call most.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "contacts",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "documents",
      "Locale": "en",
      "TitleKey": "Feature.documents",
      "Body": "Documents Shared documents such as procedures and preplans. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Upload your most-used documents and organize them by category.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "documents",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "protocols",
      "Locale": "en",
      "TitleKey": "Feature.protocols",
      "Body": "Protocols Dispatch protocols with scripted questions and instructions. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Create protocols for the call types that need scripted questions. The library also holds SOGs, clinical guidelines, policies, procedures and references. A change is written as a draft, submitted to the Review Queue, approved with a step-up or passkey signature and published now or on a set date; any two versions can be compared, and a protocol that is still current can be stamped \"reviewed, no change\". Categories set approval steps, Settings (department administrators) sets signature, review and retention rules, and Import brings protocols in from an exchange file as drafts.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocols",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "new-contact",
      "Locale": "en",
      "TitleKey": "Feature.new-contact",
      "Body": "New Contact Add a person or organization contact. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "new-contact",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "contact-categories",
      "Locale": "en",
      "TitleKey": "Feature.contact-categories",
      "Body": "Contact Categories Categories for organizing contacts. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "contact-categories",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "new-document",
      "Locale": "en",
      "TitleKey": "Feature.new-document",
      "Body": "Upload Document Upload a document. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "new-document",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "notes",
      "Locale": "en",
      "TitleKey": "Feature.notes",
      "Body": "Notes Short shared notes for the department. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "notes",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "new-note",
      "Locale": "en",
      "TitleKey": "Feature.new-note",
      "Body": "New Note Post a department note. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "new-note",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "new-protocol",
      "Locale": "en",
      "TitleKey": "Feature.new-protocol",
      "Body": "New Protocol Create a dispatch protocol. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "new-protocol",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "protocol-edit",
      "Locale": "en",
      "TitleKey": "Feature.protocol-edit",
      "Body": "Edit Protocols Change a protocol's content, triggers and questions in place; calls keep the text they were dispatched with. Triggers, questions and answers keep their ids when edited, and each call shows the text as dispatched, marked when the protocol has changed since.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-edit",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "protocol-disable",
      "Locale": "en",
      "TitleKey": "Feature.protocol-disable",
      "Body": "Disable Protocols Stop suggesting and attaching a protocol without deleting it. A disabled protocol stays in the library, leaves the apps' lists and offline reference data, and is refused when a call form or app tries to attach it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-disable",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "call-protocol-removal",
      "Locale": "en",
      "TitleKey": "Feature.call-protocol-removal",
      "Body": "Remove a Protocol from a Call Take a mis-attached protocol off a call with a reason; the record keeps it, marked removed. On View Call, open the Protocols tab and use Remove from call; the removal is written to the department's audit log.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "call-protocol-removal",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "protocol-review-queue",
      "Locale": "en",
      "TitleKey": "Feature.protocol-review-queue",
      "Body": "Protocol Review Queue Approve or reject submitted protocol versions with a signed approval, then publish them now or on a set date. Authors and approvers see the queue. An approver opens a submitted version to read the redline against the version in force; its open review comments must be resolved before it can be approved, and a rejection needs a comment. A category can require several steps, each for a named member or role. Every approval is a step-up or passkey (L2) signature bound to the version's exact content, and an approved version is published as a major or minor version, now or on its effective date.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-review-queue",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "protocol-review-stamp",
      "Locale": "en",
      "TitleKey": "Feature.protocol-review-stamp",
      "Body": "Record a Protocol Review Mark a published protocol \"reviewed, no change\" with a signed stamp, without a new version. The protocol's owner or an approver records it from the protocol's page. It is signed like an approval, restarts the review interval and its reminders, and members do not have to acknowledge the protocol again.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-review-stamp",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "protocol-compare",
      "Locale": "en",
      "TitleKey": "Feature.protocol-compare",
      "Body": "Compare Protocol Versions See what changed between two versions of a protocol as a redline. Open Compare from the version history on a protocol's page. Members compare the versions they can read; authors and approvers can include drafts and versions in review.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-compare",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "protocol-categories",
      "Locale": "en",
      "TitleKey": "Feature.protocol-categories",
      "Body": "Protocol Categories Group the library into categories and set the approval steps each category needs. Authors see the categories; approvers add, change and delete them. A category with no approval steps needs one approval from anyone with Approve Protocols, and a category still in use cannot be deleted.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-categories",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "protocol-settings",
      "Locale": "en",
      "TitleKey": "Feature.protocol-settings",
      "Body": "Protocol Settings Set signature requirements, the default review interval, version retention and the department-wide legal hold. Department administrators only; saving asks for a recent two-factor step-up and is written to the department's audit log.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-settings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "protocol-import",
      "Locale": "en",
      "TitleKey": "Feature.protocol-import",
      "Body": "Import Protocols Bring protocols in from a Resgrid protocol exchange file as drafts for review. A file holds up to 500 protocols. Categories, priorities, call types, groups and roles are matched to yours by name, and anything without a match is left out and listed. Nothing is published by an import. Export writes the whole library, or chosen protocols, in the same format.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-import",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "protocol-acknowledgments",
      "Locale": "en",
      "TitleKey": "Feature.protocol-acknowledgments",
      "Body": "My Acknowledgments Every member sees what they owe: protocols that require acknowledgment, assigned when a version is published and whenever the member joins its audience, due a set number of days later, with priority bulletins first. Reading the version and signing records the member, the time and the exact content. A minor version keeps an earlier signature; a major version asks again. A protocol can be linked to a training whose quiz must be passed.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-acknowledgments",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-compliance",
      "Locale": "en",
      "TitleKey": "Feature.protocol-compliance",
      "Body": "Acknowledgment Compliance The compliance grid lists every protocol in force that needs acknowledgment with its progress, and for one version every assigned member with their state, due date and signature time, filtered by group. Export it as CSV or PDF. Reminders go out at the due date and after, and overdue acknowledgments are escalated to the member's group admin. Standards tags and the proof-of-compliance report come with the LMS add-on.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-compliance",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "dispatch-case-review",
      "Locale": "en",
      "TitleKey": "Feature.dispatch-case-review",
      "Body": "Dispatch Case Review Officers sample calls by protocol, version, determinant, dispatcher and dates, score each recorded case question by question and instruction by instruction with a Records QA rubric beside the protocol's case flow, and send the review to the dispatcher. Reports show compliance by protocol, version, dispatcher and month, with CSV.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "dispatch-case-review",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "my-case-reviews",
      "Locale": "en",
      "TitleKey": "Feature.my-case-reviews",
      "Body": "My Case Reviews Dispatchers read the reviews of calls they handled, with every question and instruction scored and the reviewer's comments, acknowledge each one once and may reply once; the reviewer is notified of the reply.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "my-case-reviews",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-bulletins",
      "Locale": "en",
      "TitleKey": "Feature.protocol-bulletins",
      "Body": "Priority Bulletins A priority bulletin carries short content, an audience, an expiry and must-read. It is in force at once, sent by push, and shown as a must-read card at the top of home until each member acknowledges it, never over the dispatch console or a call. An approver countersigns it afterwards or withdraws it, and it leaves the library by itself when it expires. Holders of Approve Protocols issue them.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-bulletins",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-bulk-upload",
      "Locale": "en",
      "TitleKey": "Feature.protocol-bulk-upload",
      "Body": "Upload Protocol Documents Upload many PDF and Word files, or a zip, into a category; each becomes a draft document-backed protocol whose title and number come from the file name, and zip folders can become categories. The file is the protocol's content with the same review, publish, audience and acknowledgment, and its text is read for search. A document in Documents can also be moved to Protocols, leaving a redirect at its old link.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-bulk-upload",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-block-editor",
      "Locale": "en",
      "TitleKey": "Feature.protocol-block-editor",
      "Body": "Structured Protocol Content New protocol drafts are written in a block editor: headings, paragraphs, ordered steps, caution and warning boxes, \"contact medical control\" gates, tables, images, video links, attachments, links to other protocols, POIs, inventory items, checklists and trainings, medications, adult/pediatric variant groups and scope-of-practice tags. Every block has a stable anchor that review comments and AI citations point at. Medication doses are shown exactly as authored and never calculated; the department dosing-tool link appears with every medication. An older rich-text draft keeps its editor until an author chooses Convert to blocks; published versions and their hashes never change.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-block-editor",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-step-through",
      "Locale": "en",
      "TitleKey": "Feature.protocol-step-through",
      "Body": "Protocol Step-Through on Calls A Procedure or Dispatch protocol on a call can be stepped through like a checklist from View Call: each step is marked done, skipped or not applicable, timestamped by the server with who did it, and the log is kept on the call. Incident SOP checklists such as MAYDAY, RIT and hazmat entry are the department's Procedure protocols, started on a call from the same panel. Omni uses the same steps through the v4 API.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-step-through",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-book",
      "Locale": "en",
      "TitleKey": "Feature.protocol-book",
      "Body": "Protocol PDF Book, QR Code and Print View The PDF book holds a table of contents and every protocol in force with its version, effective date and approver, for one category or the whole library, limited to what the member may read. It is sealed when document sealing is configured and otherwise recorded as sealing pending. Each protocol also has a print view and a QR code poster for apparatus and station walls that opens the version in force.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-book",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-translations",
      "Locale": "en",
      "TitleKey": "Feature.protocol-translations",
      "Body": "Protocol Content Translations An author can translate a submitted or published version into another language; only the wording is translated, while doses, links, attachments and the structure stay as in the source. An approver signs each translation at L2, bound to the translation's own content, and the source version's hash and signatures never change. Members read the approved translation in their language, or the department's content language when there is none, set under Protocols settings.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-translations",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-public-pages",
      "Locale": "en",
      "TitleKey": "Feature.protocol-public-pages",
      "Body": "Public Protocol Pages Publish a protocol's version in force, or a category as a set, at an opt-in public address with an embed code. Drafts, audience-restricted and licensed content are never shown, and a page can be revoked at any time.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-public-pages",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-template-library",
      "Locale": "en",
      "TitleKey": "Feature.protocol-template-library",
      "Body": "Protocol Template Library Clone starter sets written by Resgrid (fire SOGs, search and rescue, industrial hazards, business continuity, law enforcement policies, security post orders, workplace policies and an EMS outline without clinical text) into the library as drafts in your language, with the source, licence and version kept on each version.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-template-library",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "community-exchange",
      "Locale": "en",
      "TitleKey": "Feature.community-exchange",
      "Body": "Community Exchange Share protocols and trainings with other departments for free. Department data is taken out, licensed content is refused, Resgrid reviews every contribution before it is listed, and other departments can rate, comment on and import a copy with the attribution kept.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "community-exchange",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-open-format",
      "Locale": "en",
      "TitleKey": "Feature.protocol-open-format",
      "Body": "Protocol Open Format and Export Export the library or a category in the documented open JSON format (blocks, version history, decision graph, translations and an attachments list), as one HTML file or as the PDF book. Files in the older format still import.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-open-format",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "protocol-analytics",
      "Locale": "en",
      "TitleKey": "Feature.protocol-analytics",
      "Body": "Protocol Analytics See how protocols are used on calls by version, the determinant distribution and override rate, time on protocol, acknowledgment compliance and searches that found nothing, with a CSV export.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-analytics",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "forms",
      "Locale": "en",
      "TitleKey": "Feature.forms",
      "Body": "Forms Custom forms used on calls and dispatches. Members find the current procedure, preplan or phone number when they need it instead of searching email. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "forms",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "shared-links",
      "Locale": "en",
      "TitleKey": "Feature.shared-links",
      "Body": "Shared links Share selected calls, units and personnel with a linked department. Review exposed data and link access before distribution. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "shared-links",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "file-library",
      "Locale": "en",
      "TitleKey": "Feature.file-library",
      "Body": "Files and attachments Files attached to documents and records. Keep reference material with its owner, permissions and retention policy. A department uploads its standard operating procedures, adds hospital and mutual-aid contacts and creates a medical dispatch protocol. Gather the documents and contacts members need most, and decide who keeps them current.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "file-library",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "setting.KnowledgeSettings",
      "Locale": "en",
      "TitleKey": "Setting.KnowledgeSettings",
      "Body": "Knowledge Settings. Department-wide rules for knowledge answers on the Knowledge Settings page: whether the Documents module is used, and the department's dosing tool link. Missing means Documents are not used and there is no dosing link. Only department administrators can change it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-knowledgesettings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.KnowledgeSettings.IncludeDocuments",
      "Locale": "en",
      "TitleKey": "Field.KnowledgeSettings.IncludeDocuments",
      "Body": "Knowledge Settings / Include Documents. Documents join the sources knowledge answers use. Admins-only documents are used only for administrators, and no document is used while Advanced Data Protection is on. Changing it rebuilds the department's knowledge index in the background.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-knowledgesettings-includedocuments",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.KnowledgeSettings.DosingToolUrl",
      "Locale": "en",
      "TitleKey": "Field.KnowledgeSettings.DosingToolUrl",
      "Body": "Knowledge Settings / Dosing Tool Link. An https link to the department's dosing tool. Answers that quote a dose show it; doses are only ever quoted from a source, and neither the model nor Resgrid calculates one. Anything but an https link is refused.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-knowledgesettings-dosingtoolurl",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "setting.ContentSetSettings",
      "Locale": "en",
      "TitleKey": "Setting.ContentSetSettings",
      "Body": "Set update time. The local time accepted protocol and course set updates go into force on or after their effective date (default 07:00, so nothing changes mid-shift by surprise), and who is told when an update arrives, a proposal is answered, a sponsorship changes or an LTI tool needs registering: the administrators (unless turned off) and members of the roles chosen.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-contentsetsettings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-26T00:00:00Z"
    },
    {
      "Id": "protocol-sets",
      "Locale": "en",
      "TitleKey": "Feature.protocol-sets",
      "Body": "Protocol Sets Publish protocols to linked departments as a regional set, or subscribe to a county, medical director or corporate set. Locked content follows the publisher, customizable blocks keep local phone numbers and resources, every new version arrives as a redline in the update inbox and goes into force at your update time, and members propose changes upstream.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "protocol-sets",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-26T00:00:00Z"
    },
    {
      "Id": "linked-department-protocols",
      "Locale": "en",
      "TitleKey": "Feature.linked-department-protocols",
      "Body": "Linked Department Protocols Read a mutual-aid partner's published protocols over a Department Link that shares Protocols, read-only and only the version in force. Restricted, licensed and uploaded-document protocols are never shared, and turning the share off cuts access at once.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "linked-department-protocols",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-26T00:00:00Z"
    },
    {
      "Id": "department-link-acceptance",
      "Locale": "en",
      "TitleKey": "Feature.department-link-acceptance",
      "Body": "Signed Link Acceptance Accepting a link from another organization is a step-up signature by one of your administrators, bound to the two organizations and what each shares at that moment; without the step-up the link stays unaccepted.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "department-link-acceptance",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-26T00:00:00Z"
    }
  ]
}
