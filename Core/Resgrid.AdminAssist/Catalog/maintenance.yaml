  "Articles": [
    {
      "Id": "module.MaintenanceDisabled",
      "Locale": "en",
      "TitleKey": "Module.MaintenanceDisabled",
      "Body": "Maintenance availability. Controls availability of maintenance and work orders. Disabling this module can remove navigation and block module operations; it does not delete its records. Turning it on still requires the applicable subscription, rollout and permissions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-maintenancedisabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "module.MaintenanceNameOverride",
      "Locale": "en",
      "TitleKey": "Module.MaintenanceNameOverride",
      "Body": "Maintenance menu name. Optional display name for maintenance and work orders in consumers that support the override. It changes the label, not permissions or functionality. This release has no separate name-override control in Module Settings.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-maintenancenameoverride",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "work-orders",
      "Locale": "en",
      "TitleKey": "Feature.work-orders",
      "Body": "Work Orders Repair and maintenance work orders. Turn a failed check or reported defect into a tracked repair and a documented return to service. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Create work orders from failed checks or reported defects.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "work-orders",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "preventive-maintenance",
      "Locale": "en",
      "TitleKey": "Feature.preventive-maintenance",
      "Body": "Preventive maintenance Recurring maintenance schedules. Plan equipment upkeep and track corrective responsibility. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Schedule routine service for each apparatus.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "preventive-maintenance",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "asset-service-setup",
      "Locale": "en",
      "TitleKey": "Feature.asset-service-setup",
      "Body": "Asset service setup Annual, 6-year and hydrostatic test service schedules for every fire extinguisher or other serialized asset of an inventory item at once. Under Work Orders, Preventive maintenance, Set up asset service, choose the item, the first due date, the lead time, the role and the services its type needs. One completion-based yearly schedule is created per asset and service, named with the asset tag or serial number; running it again only adds assets added since. Keep the monthly visual inspection as a checklist on each extinguisher. Requires the Readiness Pro add-on.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "asset-service-setup",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-27T00:00:00Z"
    },
    {
      "Id": "maintenance-policy",
      "Locale": "en",
      "TitleKey": "Feature.maintenance-policy",
      "Body": "Maintenance policies and approvals Repair approvals and safety holds. Make authority and repair completion requirements explicit. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Decide who approves repairs and returns equipment to service.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "maintenance-policy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "new-work-order",
      "Locale": "en",
      "TitleKey": "Feature.new-work-order",
      "Body": "New Work Order Open a work order. Turn a failed check or reported defect into a tracked repair and a documented return to service. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Requires the Readiness Pro add-on. Checklists remain available without it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "new-work-order",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "maintenance-reports",
      "Locale": "en",
      "TitleKey": "Feature.maintenance-reports",
      "Body": "Maintenance history and reports Maintenance history, repair costs and safety holds. Support accountable return-to-service review through the owning workflow. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Requires the Readiness Pro add-on. Checklists remain available without it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "maintenance-reports",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "failure-review",
      "Locale": "en",
      "TitleKey": "Feature.failure-review",
      "Body": "Failure review Older checklist failures that were not turned into work orders automatically. Checklist items set to create a work order on failure are handled automatically only while the failure is less than 72 hours old; older failures, such as those recorded before Readiness Pro was turned on, wait in Work Orders, Failure review. A manager creates a work order for each one (no unit or equipment hold is applied) or dismisses it. Turning on Readiness Pro never floods work orders or takes units out of service for old failures. Requires the Readiness Pro add-on and Manage Work Orders for the whole department.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "failure-review",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-27T00:00:00Z"
    },
    {
      "Id": "addon-readiness",
      "Locale": "en",
      "TitleKey": "Feature.addon-readiness",
      "Body": "Readiness Pro The Readiness Pro add-on: work orders, preventive maintenance, repair approvals and safety holds. Give equipment defects an owner and a recorded repair and return-to-service review. A failed apparatus check leads to an explicitly created maintenance work order. Checklists do not require this add-on. Maintenance needs its module, permissions and active entitlement. Historical evidence and hold release follow owning-module rules. It also includes Failure review for checklist failures recorded before activation, and Set up asset service for extinguisher and other long-interval service schedules.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "addon-readiness",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-27T00:00:00Z"
    },
    {
      "Id": "readiness-signatures",
      "Locale": "en",
      "TitleKey": "Feature.readiness-signatures",
      "Body": "Vendor acceptance and issue receipts Vendors accept completed work orders, and members or recipients sign receipts for issued equipment, in person or by a Resgrid link. Replace verbal hand-offs with signed acceptances and receipts that the other party can verify. The pump repair shop's technician signs the completed work order on the station tablet before driving away. Open a completed work order, or an issued item's Receipt, and request the signature. Remote links need Readiness Pro and the department's e-sign settings.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "readiness-signatures",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    }
  ]
}
