      "Id": "module.MaintenanceDisabled",
      "Locale": "en",
      "TitleKey": "Module.MaintenanceDisabled",
      "Body": "Maintenance availability. Controls availability of maintenance and work orders. Disabling this module can remove navigation and block module operations; it does not delete its records. Turning it on still requires the applicable subscription, rollout and permissions.",
