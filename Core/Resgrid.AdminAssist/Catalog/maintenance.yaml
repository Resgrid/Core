      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "module.MaintenanceNameOverride",
      "Locale": "en",
      "TitleKey": "Module.MaintenanceNameOverride",
      "Body": "Maintenance menu name. Optional display name for maintenance and work orders in consumers that support the override. It changes the label, not permissions or functionality. This release has no separate name-override control in Module Settings.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-maintenancenameoverride",
      "PackVersion": "2026.09.25.2",
