    },
    {
      "Id": "work-orders",
      "Locale": "en",
      "TitleKey": "Feature.work-orders",
      "Body": "Work Orders Repair and maintenance work orders. Turn a failed check or reported defect into a tracked repair and a documented return to service. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Create work orders from failed checks or reported defects.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "work-orders",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "preventive-maintenance",
      "Locale": "en",
      "TitleKey": "Feature.preventive-maintenance",
      "Body": "Preventive maintenance Recurring maintenance schedules. Plan equipment upkeep and track corrective responsibility. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Schedule routine service for each apparatus.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "preventive-maintenance",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "maintenance-policy",
      "Locale": "en",
      "TitleKey": "Feature.maintenance-policy",
      "Body": "Maintenance policies and approvals Repair approvals and safety holds. Make authority and repair completion requirements explicit. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Decide who approves repairs and returns equipment to service.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "maintenance-policy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "new-work-order",
      "Locale": "en",
      "TitleKey": "Feature.new-work-order",
      "Body": "New Work Order Open a work order. Turn a failed check or reported defect into a tracked repair and a documented return to service. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Requires the Readiness Pro add-on. Checklists remain available without it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "new-work-order",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "maintenance-reports",
      "Locale": "en",
      "TitleKey": "Feature.maintenance-reports",
      "Body": "Maintenance history and reports Maintenance history, repair costs and safety holds. Support accountable return-to-service review through the owning workflow. A failed pump test creates a work order, and the engine stays on a safety hold until the repair is approved. Requires the Readiness Pro add-on. Checklists remain available without it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "maintenance-reports",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "addon-readiness",
      "Locale": "en",
      "TitleKey": "Feature.addon-readiness",
      "Body": "Readiness Pro The Readiness Pro add-on: work orders, preventive maintenance, repair approvals and safety holds. Give equipment defects an owner and a recorded repair and return-to-service review. A failed apparatus check leads to an explicitly created maintenance work order. Checklists do not require this add-on. Maintenance needs its module, permissions and active entitlement. Historical evidence and hold release follow owning-module rules.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "addon-readiness",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    }
