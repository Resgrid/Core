    {
      "Id": "mapping",
      "Locale": "en",
      "TitleKey": "Feature.mapping",
      "Body": "Mapping The live map of personnel, units and calls. A current map shows where responders and apparatus are and puts important locations in front of dispatchers. A department adds its stations and hospitals as points of interest and lets personnel locations expire after 60 minutes so old positions disappear. Set how long locations stay on the map in the mapping settings.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "mapping",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "pois",
      "Locale": "en",
      "TitleKey": "Feature.pois",
      "Body": "Points of Interest Points of interest such as stations, hospitals and hydrants. A current map shows where responders and apparatus are and puts important locations in front of dispatchers. A department adds its stations and hospitals as points of interest and lets personnel locations expire after 60 minutes so old positions disappear. Add the locations dispatchers need to see.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "pois",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "weather",
      "Locale": "en",
      "TitleKey": "Feature.weather",
      "Body": "Weather zones and alerts Weather alert zones and alert notifications. Review alert coverage and automatic-message settings before use. A department adds its stations and hospitals as points of interest and lets personnel locations expire after 60 minutes so old positions disappear. Draw the zones you cover and choose who is alerted.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "weather",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "map-layers",
      "Locale": "en",
      "TitleKey": "Feature.map-layers",
      "Body": "Map Layers Add your own shapes and overlays to the map. A current map shows where responders and apparatus are and puts important locations in front of dispatchers. A department adds its stations and hospitals as points of interest and lets personnel locations expire after 60 minutes so old positions disappear. Confirm members allow location sharing in the Responder app, and decide how long a position should stay on the map.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "map-layers",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "live-routing",
      "Locale": "en",
      "TitleKey": "Feature.live-routing",
      "Body": "Live Routing Directions and routes for responding resources. A current map shows where responders and apparatus are and puts important locations in front of dispatchers. A department adds its stations and hospitals as points of interest and lets personnel locations expire after 60 minutes so old positions disappear. Confirm members allow location sharing in the Responder app, and decide how long a position should stay on the map.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "live-routing",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "custom-maps",
      "Locale": "en",
      "TitleKey": "Feature.custom-maps",
      "Body": "Custom map layers Upload your own map images, such as a campus or venue map. Give responders useful reference layers with an identified owner and update process. A department adds its stations and hospitals as points of interest and lets personnel locations expire after 60 minutes so old positions disappear. Confirm members allow location sharing in the Responder app, and decide how long a position should stay on the map.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "custom-maps",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "indoor-maps",
      "Locale": "en",
      "TitleKey": "Feature.indoor-maps",
      "Body": "Indoor maps Floor plans and zones for buildings. Keep building references available to authorized users without inferring safe routes. A department adds its stations and hospitals as points of interest and lets personnel locations expire after 60 minutes so old positions disappear. Confirm members allow location sharing in the Responder app, and decide how long a position should stay on the map.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "indoor-maps",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "routes",
      "Locale": "en",
      "TitleKey": "Feature.routes",
      "Body": "Routes Planned routes, such as patrols, and who is assigned to them. Prepare recurring route information with current source ownership. A department adds its stations and hospitals as points of interest and lets personnel locations expire after 60 minutes so old positions disappear. Confirm members allow location sharing in the Responder app, and decide how long a position should stay on the map.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "routes",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
