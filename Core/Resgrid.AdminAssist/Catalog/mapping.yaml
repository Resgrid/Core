    {
      "Id": "setting.WeatherAlertCallIntegration",
      "Locale": "en",
      "TitleKey": "Setting.WeatherAlertCallIntegration",
      "Body": "Weather Alert Call Integration. Include supported weather context in call integration. It does not certify weather or route safety.",
