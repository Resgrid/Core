    {
      "Id": "setting.WeatherAlertCacheMinutes",
      "Locale": "en",
      "TitleKey": "Setting.WeatherAlertCacheMinutes",
      "Body": "Weather Alert Cache Minutes. Weather cache duration; longer caching changes freshness and provider load.",
