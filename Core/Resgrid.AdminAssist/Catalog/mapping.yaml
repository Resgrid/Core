    {
      "Id": "setting.WeatherAlertAutoMessageSchedule",
      "Locale": "en",
      "TitleKey": "Setting.WeatherAlertAutoMessageSchedule",
      "Body": "Weather Alert Auto Message Schedule. Schedule for automatic weather messaging. Review the department time zone, overnight periods and daylight-saving changes.",
