      "TitleKey": "Field.WellnessSettings.RetentionYears",
      "Body": "Wellness settings / Keep entries for (years). Years an exposure entry is kept after it happened, from 30 (the OSHA 29 CFR 1910.1020 minimum) to 100. A legal hold keeps entries longer.",
