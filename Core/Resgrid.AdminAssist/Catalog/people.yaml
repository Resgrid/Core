      "Locale": "en",
      "TitleKey": "Setting.WellnessSettings",
      "Body": "Wellness settings. Who reads members' exposure and critical-incident logs (the wellness officer role), who the designated officers and the peer support team are, the certification each wellness role can hold, and how many years entries are kept. Member wellness is part of the Workforce Pro add-on, not the LMS add-on: without it, existing records are read-only.",
