    },
    {
      "Id": "field.WellnessSettings.RequireCurrentCertification",
      "Locale": "en",
      "TitleKey": "Field.WellnessSettings.RequireCurrentCertification",
      "Body": "Wellness settings / Only members with a current certification act. Off (the default): the wellness officer, designated officer and peer support roles alone decide who acts, and each linked certification is shown as status. On: a role member also needs a current certification of the role's linked type; a role with no linked type is not affected. It cannot be turned on while nobody in the wellness officer or designated officer role holds a current certification.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-wellnesssettings-requirecurrentcertification",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-26T00:00:00Z"
