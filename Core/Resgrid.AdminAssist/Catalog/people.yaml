      "TitleKey": "Field.WellnessSettings.PeerTeamCertificationTypeId",
      "Body": "Wellness settings / Peer support team certification. Members holding a current certification of this type are the peer support team and receive the critical-incident anniversary reminders a member chooses to share. None turns the team off.",
