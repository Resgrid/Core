    {
      "Id": "field.WellnessSettings.WellnessOfficerRoleId",
      "Locale": "en",
      "TitleKey": "Field.WellnessSettings.WellnessOfficerRoleId",
      "Body": "Wellness settings / Wellness officer role. Members of this personnel role read every member's exposure log and keep screening flags and follow-ups. Department administrators do not see the logs unless they hold the role. None leaves each log to its member.",
