      "TitleKey": "Field.WellnessSettings.DesignatedOfficerRoleId",
      "Body": "Wellness settings / Designated officer role. Members of this personnel role receive bloodborne-pathogen and infectious-disease exposure reports (Ryan White Part G) and run the exposure cases. None means the wellness officer role serves.",
