      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.WellnessSettings.PeerTeamCertificationTypeId",
      "Locale": "en",
      "TitleKey": "Field.WellnessSettings.PeerTeamCertificationTypeId",
      "Body": "Wellness settings / Peer support team certification. The peer support team's certification type. With a peer support team role, it is shown as each team member's status; with no role, the members holding a current certification of this type are the team and receive the critical-incident anniversary reminders a member chooses to share. With neither, there is no team.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
