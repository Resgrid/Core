      "TitleKey": "Field.WellnessSettings.PeerTeamRoleId",
      "Body": "Wellness settings / Peer support team role. Members of this personnel role are the peer support team and receive the critical-incident anniversary reminders a member chooses to share. None: the members holding a current peer support team certification are the team.",
