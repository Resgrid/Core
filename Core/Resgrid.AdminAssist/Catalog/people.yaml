    {
      "Id": "member-wellness",
      "Locale": "en",
      "TitleKey": "Feature.member-wellness",
      "Body": "My Exposures Each member's own log of carcinogen, bloodborne pathogen, hazardous substance and critical-incident exposures, with entries suggested from dispatch data after a call is flagged. Exposure records for cancer presumption and workers' compensation, kept 30 years, without anyone but the member and the wellness officers reading them. After a structure fire, the officer flags the call; each member on scene confirms a suggested carcinogen entry and adds the PPE worn and decontamination done. Choose the wellness officer role in Personnel, My exposures, Settings. Members open My exposures from Personnel; officers flag a call from its Wellness follow-up button.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "member-wellness",
