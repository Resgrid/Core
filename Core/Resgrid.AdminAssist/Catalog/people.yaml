    {
      "Id": "personnel",
      "Locale": "en",
      "TitleKey": "Feature.personnel",
      "Body": "Personnel Member accounts, contact details and status. Dispatch, notifications, permissions and reports all start from who belongs to which group, so set this up first. A volunteer department creates Station 1 and Station 2 groups, invites 24 members and assigns Engineer and Firefighter roles. Invite members or add them directly, then check that each has a mobile number or email address.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "personnel",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "invites",
      "Locale": "en",
      "TitleKey": "Feature.invites",
      "Body": "Manage Invites Email invitations for new members to join the department. Dispatch, notifications, permissions and reports all start from who belongs to which group, so set this up first. A volunteer department creates Station 1 and Station 2 groups, invites 24 members and assigns Engineer and Firefighter roles. Send invitations and follow up on any that have not been accepted.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "invites",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "groups",
      "Locale": "en",
      "TitleKey": "Feature.groups",
      "Body": "Groups & Stations Stations and groups that organize members and units. Dispatch, notifications, permissions and reports all start from who belongs to which group, so set this up first. A volunteer department creates Station 1 and Station 2 groups, invites 24 members and assigns Engineer and Firefighter roles. Create a station group for each station with its address, and organizational groups for teams, then add members.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "groups",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "personnel-roles",
      "Locale": "en",
      "TitleKey": "Feature.personnel-roles",
      "Body": "Personnel roles Roles such as Firefighter, EMT or Officer. Describe responsibility consistently without assuming that a role proves qualification. A volunteer department creates Station 1 and Station 2 groups, invites 24 members and assigns Engineer and Firefighter roles. Create the roles you dispatch or report on, and assign them to members.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "personnel-roles",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "add-person",
      "Locale": "en",
      "TitleKey": "Feature.add-person",
      "Body": "Add Person Create a member account directly instead of sending an invitation. Dispatch, notifications, permissions and reports all start from who belongs to which group, so set this up first. A volunteer department creates Station 1 and Station 2 groups, invites 24 members and assigns Engineer and Firefighter roles. Have your member list with email addresses or mobile numbers, and decide how stations or teams are grouped.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "add-person",
