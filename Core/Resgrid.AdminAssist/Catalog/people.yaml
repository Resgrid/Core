      "TitleKey": "Field.WellnessSettings.BbpTrainingCertificationTypeId",
      "Body": "Wellness settings / Bloodborne-pathogen training certification. The certification type of the annual bloodborne-pathogen training (OSHA 1910.1030). Each exposure case shows the member's current status of it. None leaves it untracked.",
