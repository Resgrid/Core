      "TitleKey": "Field.WellnessSettings.MedicalClearanceCertificationTypeId",
      "Body": "Wellness settings / Medical clearance certification. The certification type an NFPA 1582 medical evaluation is also recorded as (from the Medical Clearance (NFPA 1582) template). Not cleared suspends it. None keeps clearances in Wellness only.",
