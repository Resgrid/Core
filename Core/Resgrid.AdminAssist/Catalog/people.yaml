    {
      "Id": "field.WellnessSettings.DesignatedOfficerCertificationTypeId",
      "Locale": "en",
      "TitleKey": "Field.WellnessSettings.DesignatedOfficerCertificationTypeId",
      "Body": "Wellness settings / Designated officer certification. A certification type of the department, such as one added from the Designated Exposure Control Officer template, shown as each designated officer's status. None: while no designated officer role is named, the wellness officer certification serves.",
