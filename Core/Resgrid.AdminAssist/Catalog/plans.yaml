    {
      "Id": "module.AiDisabled",
      "Locale": "en",
      "TitleKey": "Module.AiDisabled",
      "Body": "Ai availability. Controls availability of optional AI assistance. Disabling this module can remove navigation and block module operations; it does not delete its records. Turning it on still requires the applicable subscription, rollout and permissions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-aidisabled",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "addon-ptt",
      "Locale": "en",
      "TitleKey": "Feature.addon-ptt",
      "Body": "Push-to-Talk Voice channels for crew communication in supported Resgrid clients. Coordinate field teams through configured voice channels. A SAR coordinator uses a team channel during a training exercise. Review seats, supported clients and channel setup. PTT does not provide phone dispatch alerts or certify radio replacement.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "addon-ptt",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "addon-adp",
      "Locale": "en",
      "TitleKey": "Feature.addon-adp",
      "Body": "Advanced Data Protection Additional protection and scoped access for cataloged sensitive department content. Control protected content disclosure and recovery through the department protection lifecycle. An administrator enrolls the department and verifies its recovery arrangements. Buying does not enroll the department. Review MFA, recovery, migration and integration behavior; this is not a compliance certification.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "addon-adp",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "addon-readiness",
      "Locale": "en",
      "TitleKey": "Feature.addon-readiness",
      "Body": "Readiness Pro Maintenance, work orders, preventive tasks, corrective work, approvals and safety holds. Give equipment defects an owner and a recorded repair and return-to-service review. A failed apparatus check leads to an explicitly created maintenance work order. Checklists do not require this add-on. Maintenance needs its module, permissions and active entitlement. Historical evidence and hold release follow owning-module rules.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "addon-readiness",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "addon-business",
      "Locale": "en",
      "TitleKey": "Feature.addon-business",
      "Body": "Business Operations Invoicing, payments, rates, contracts, bids, MARS reimbursement, workforce and field costing. Connect administrative commercial work to the department activities it supports. Prepare an event standby invoice or review documented mutual-aid costs. Certifications and Deployment Finance do not require this add-on. Pay-data reporting additionally needs ADP Enabled; online payments require provider setup. No reimbursement or savings are guaranteed.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "addon-business",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "addon-ai",
      "Locale": "en",
      "TitleKey": "Feature.addon-ai",
      "Body": "Enhanced AI Planned summaries, drafts, knowledge assistance and optional Admin Assist conversation. Help explain approved evidence and prepare drafts for human review when released. Ask for an explanation of a configuration finding when the conversational feature is available. Planned until product and runtime availability are verified. Deterministic Setup Wizard, Setup Report and Admin Assist do not require an AI purchase.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "addon-ai",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "subscription",
      "Locale": "en",
      "TitleKey": "Feature.subscription",
      "Body": "Base plans and capacity Review current plan allowances and authorized subscription options. Choose capacity for actual department needs without inferring prices or terms. Review feature requirements with the managing member before using the normal billing screen. Review the owning screen, current access and source-specific requirements. Configuration, provisioning, exports and messages require explicit actions; learning about a capability does not activate it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "subscription",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    }
  ]
