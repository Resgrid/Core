      "Anchor": "field-recordsretentionpolicyversion-policy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsDisclosureConfig.StatutoryClockDays",
      "Locale": "en",
      "TitleKey": "Field.RecordsDisclosureConfig.StatutoryClockDays",
      "Body": "Records Disclosure Config / Statutory Clock Days. Configured disclosure review clock. Verify local obligations with the responsible owner; the default does not establish a legal deadline.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsdisclosureconfig-statutoryclockdays",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsDisclosureConfig.DefaultRedactionProfile",
      "Locale": "en",
      "TitleKey": "Field.RecordsDisclosureConfig.DefaultRedactionProfile",
      "Body": "Records Disclosure Config / Default Redaction Profile. Default redaction profile in the owning disclosure workflow. Review the actual proposed release before approval.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsdisclosureconfig-defaultredactionprofile",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsDisclosureConfig.ReleaseApproverUserId",
      "Locale": "en",
      "TitleKey": "Field.RecordsDisclosureConfig.ReleaseApproverUserId",
