      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsretentionoverride-retentionyears",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionOverride.AppliesFrom",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionOverride.AppliesFrom",
      "Body": "Records Retention Override / Applies From. Prospective boundary for revisions eligible for the override, evaluated by the Records lifecycle.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsretentionoverride-appliesfrom",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionPolicyVersion.EffectiveOn",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionPolicyVersion.EffectiveOn",
      "Body": "Records Retention Policy Version / Effective On. Effective timestamp of a stored historical retention policy version.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsretentionpolicyversion-effectiveon",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionPolicyVersion.Policy",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionPolicyVersion.Policy",
      "Body": "Records Retention Policy Version / Policy. Historical policy snapshot used to resolve retention for older revisions. Never edit this as an ordinary preference.",
