      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsretentionpolicy-overrides",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionPolicy.LastChangedByUserId",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionPolicy.LastChangedByUserId",
