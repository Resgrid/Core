      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsretentionpolicy-lastchangedon",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionPolicy.History",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionPolicy.History",
      "Body": "Records Retention Policy / History. Prior policy versions retained by the owning lifecycle so current changes do not silently rewrite historical retention.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsretentionpolicy-history",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionOverride.DefinitionKey",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionOverride.DefinitionKey",
      "Body": "Records Retention Override / Definition Key. Stable record-definition key to which this override applies. Display names do not identify a retention policy.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsretentionoverride-definitionkey",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionOverride.RetentionYears",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionOverride.RetentionYears",
