      "Locale": "en",
      "TitleKey": "Setting.RecordsReviewDueHours",
      "Body": "Records Review Due Hours. Default administrative review deadline; a definition-level override takes precedence. This is not a statutory deadline inference.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-recordsreviewduehours",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "setting.RecordsNumberingConfig",
      "Locale": "en",
      "TitleKey": "Setting.RecordsNumberingConfig",
      "Body": "Records Numbering Config. Department numbering for the built-in record types and incident reports: the number pattern, sequence digits, record type prefixes, the day the numbering year starts (for records numbered by a fiscal year) and raised next numbers. Numbers are assigned when a record is finalized. Department definitions with their own numbering keep it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-recordsnumberingconfig",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-08T00:00:00Z"
    },
    {
      "Id": "setting.RecordsSearchConfig",
      "Locale": "en",
      "TitleKey": "Setting.RecordsSearchConfig",
      "Body": "Records Search Config. Allowed record search scope and protected-data behavior. Search access remains bounded by current source permissions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-recordssearchconfig",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "setting.RecordsRetentionPolicy",
      "Locale": "en",
      "TitleKey": "Setting.RecordsRetentionPolicy",
      "Body": "Records Retention Policy. Default and definition-specific retention, including prior-policy history. Holds and restricted-class rules can prevent purge eligibility.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-recordsretentionpolicy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "setting.RecordsGroupVisibilityMode",
      "Locale": "en",
      "TitleKey": "Setting.RecordsGroupVisibilityMode",
      "Body": "Records Group Visibility Mode. Whether record visibility is department-wide or group scoped. Group scope narrows existing permission and never grants access.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-recordsgroupvisibilitymode",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "setting.RecordsGroupScopeConfig",
      "Locale": "en",
      "TitleKey": "Setting.RecordsGroupScopeConfig",
      "Body": "Records Group Scope Config. Reserved identifier with no editable behavior in this release. Do not present it as a shipped setting.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-recordsgroupscopeconfig",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "setting.RecordsDisclosureConfig",
      "Locale": "en",
      "TitleKey": "Setting.RecordsDisclosureConfig",
      "Body": "Records Disclosure Config. Disclosure review clock, redaction profile and release approver. Review local obligations through the authorized disclosure workflow.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-recordsdisclosureconfig",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "setting.RecordsNerisWorkflowsEnabled",
      "Locale": "en",
      "TitleKey": "Setting.RecordsNerisWorkflowsEnabled",
      "Body": "Records NERIS Workflows Enabled. Turns this department's NERIS validation, submission and NERIS setup screens on or off. Other Records settings, records and history are unchanged; the NERIS profile and queued submissions are kept for re-enabling.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-recordsnerisworkflowsenabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-03T00:00:00Z"
    },
    {
      "Id": "module.LogsDisabled",
      "Locale": "en",
      "TitleKey": "Module.LogsDisabled",
      "Body": "Logs availability. Controls availability of legacy logs. Disabling this module can remove navigation and block module operations; it does not delete its records. Turning it on still requires the applicable subscription, rollout and permissions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-logsdisabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "module.LogsNameOverride",
      "Locale": "en",
      "TitleKey": "Module.LogsNameOverride",
      "Body": "Logs menu name. Optional display name for legacy logs in consumers that support the override. It changes the label, not permissions or functionality. This release has no separate name-override control in Module Settings.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-logsnameoverride",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "module.ReportsDisabled",
      "Locale": "en",
      "TitleKey": "Module.ReportsDisabled",
      "Body": "Reports availability. Controls availability of reports. Disabling this module can remove navigation and block module operations; it does not delete its records. Turning it on still requires the applicable subscription, rollout and permissions.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-reportsdisabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "module.ReportsNameOverride",
      "Locale": "en",
      "TitleKey": "Module.ReportsNameOverride",
      "Body": "Reports menu name. Optional display name for reports in consumers that support the override. It changes the label, not permissions or functionality. This release has no separate name-override control in Module Settings.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "module-reportsnameoverride",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.NumberAssignment",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.NumberAssignment",
      "Body": "Records Numbering Config / Number Assignment. Choose when numbers are assigned for definitions using department defaults. Review existing references before changing numbering behavior.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-numberassignment",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.ResetYearly",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.ResetYearly",
      "Body": "Records Numbering Config / Reset Yearly. Restart record sequences each numbering year (the calendar year unless a fiscal year start is set) in the department time zone.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-resetyearly",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-08T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.SequenceWidth",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.SequenceWidth",
      "Body": "Records Numbering Config / Sequence Width. Digits in the SEQ part of the number pattern, zero-padded: 4 writes 0184. 3 to 8 digits; changing it keeps each sequence's next number. Department definitions with their own numbering keep their own width.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-sequencewidth",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-05T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.IncludeYear",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.IncludeYear",
      "Body": "Records Numbering Config / Include Year. Include the year between the record prefix and sequence number.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-includeyear",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.PerGroupSequence",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.PerGroupSequence",
      "Body": "Records Numbering Config / Per Group Sequence. Use separate station/group sequences. This changes numbering, not record visibility.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-pergroupsequence",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.Floors",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.Floors",
      "Body": "Records Numbering Config / Floors. Raised next numbers, one per record-number sequence, for departments continuing numbers issued before Resgrid. A next number only rises, and numbers already issued always win, so a raised next number never causes a duplicate.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-floors",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-04T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.Pattern",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.Pattern",
      "Body": "Records Numbering Config / Pattern. How record numbers are written for the built-in record types and incident reports, for example RUN-0153: fixed text plus the PREFIX, YYYY or YY, GROUP and SEQ tokens. PREFIX writes each record type's prefix: its default or the department's own, from \"Record type prefixes\". Changing the pattern never renumbers records already numbered. Until a pattern is saved, the screen shows the one the department has always used.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-pattern",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-05T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.Prefixes",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.Prefixes",
      "Body": "Records Numbering Config / Prefixes. The department's own prefix for each built-in record type and for incident reports, written by the PREFIX token in place of the default (RUN, TRN, INC and so on). A type with no prefix of its own uses its default. A new prefix starts its own sequence; numbers already issued keep their prefix, and types given the same prefix share one sequence.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-prefixes",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-05T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.YearStartMonth",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.YearStartMonth",
      "Body": "Records Numbering Config / Year Start Month. Month the numbering year starts, for records numbered by a fiscal year such as a county's or state's. Sequences that include the year start again at 1 on that month and day, and YYYY and YY write the fiscal year's name. Unset is January, the calendar year. Separate from call numbering's year start. Records request numbers and the numbers of inspections, permits, occupancies, investigations and evidence follow the same year.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-yearstartmonth",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-08T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.YearStartDay",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.YearStartDay",
      "Body": "Records Numbering Config / Year Start Day. Day of the month the numbering year starts, 1 to the month's last day; February 29 is not allowed. Unset is the 1st.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-yearstartday",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-08T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingConfig.YearLabel",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingConfig.YearLabel",
      "Body": "Records Numbering Config / Year Label. Which year names a numbering year that does not start on January 1: the year it ends in (the usual fiscal-year convention, so a year starting November 1, 2026 is 2027) or the year it starts in.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingconfig-yearlabel",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-08T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingFloor.NextSequence",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingFloor.NextSequence",
      "Body": "Records Numbering Floor / Next Sequence. The lowest sequence number that sequence may issue next.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingfloor-nextsequence",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-04T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingFloor.ScopeKey",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingFloor.ScopeKey",
      "Body": "Records Numbering Floor / Scope Key. The sequence a raised next number applies to: the text the pattern renders around the sequence, with # in its place.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingfloor-scopekey",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-04T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingFloor.SetByUserId",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingFloor.SetByUserId",
      "Body": "Records Numbering Floor / Set By User ID. The administrator who raised the next number.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingfloor-setbyuserid",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-04T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingFloor.SetOn",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingFloor.SetOn",
      "Body": "Records Numbering Floor / Set On. When the next number was raised (UTC).",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingfloor-seton",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-04T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingPrefix.DefinitionKey",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingPrefix.DefinitionKey",
      "Body": "Records Numbering Prefix / Definition Key. The built-in record type the prefix applies to, such as system.run or system.neris-incident.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingprefix-definitionkey",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-05T00:00:00Z"
    },
    {
      "Id": "field.RecordsNumberingPrefix.Prefix",
      "Locale": "en",
      "TitleKey": "Field.RecordsNumberingPrefix.Prefix",
      "Body": "Records Numbering Prefix / Prefix. 2 to 6 upper-case letters (A-Z) or digits. A prefix that no longer validates falls back to the type's default.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsnumberingprefix-prefix",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-10-05T00:00:00Z"
    },
    {
      "Id": "field.RecordsSearchConfig.IndexNarrative",
      "Locale": "en",
      "TitleKey": "Field.RecordsSearchConfig.IndexNarrative",
      "Body": "Records Search Config / Index Narrative. Include unprotected narrative in search. Advanced Data Protection enrollment withdraws narrative indexing; this preference cannot override protection.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordssearchconfig-indexnarrative",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsSearchConfig.IncludeLegacyHistory",
      "Locale": "en",
      "TitleKey": "Field.RecordsSearchConfig.IncludeLegacyHistory",
      "Body": "Records Search Config / Include Legacy History. Include supported legacy personnel and unit logs in the Records search scope. Source permissions still apply.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordssearchconfig-includelegacyhistory",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionPolicy.DepartmentDefaultYears",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionPolicy.DepartmentDefaultYears",
      "Body": "Records Retention Policy / Department Default Years. Department retention for standard record classes. Zero means permanent; protected classes, prior policy and holds can retain records longer.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-recordsretentionpolicy-departmentdefaultyears",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "field.RecordsRetentionPolicy.Overrides",
      "Locale": "en",
      "TitleKey": "Field.RecordsRetentionPolicy.Overrides",
