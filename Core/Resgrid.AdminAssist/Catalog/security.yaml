      "Anchor": "table-departmentsecuritypolicy-allowedipranges",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentSecurityPolicy.PasswordExpirationDays",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentSecurityPolicy.PasswordExpirationDays",
      "Body": "Department Security Policy / Password Expiration Days. Password age in days; zero disables this policy's age limit. Verify local-password and SSO behavior separately.",
