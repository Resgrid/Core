    },
    {
      "Id": "table.DepartmentSecurityPolicy.RequireMfa",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentSecurityPolicy.RequireMfa",
      "Body": "Department Security Policy / Require Mfa. Department-wide MFA policy, distinct from the administrator-only setting. Review enrollment, supported factors and recovery before enforcement.",
