      "Anchor": "table-departmentsecuritypolicy-sessiontimeoutminutes",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentSecurityPolicy.MaxConcurrentSessions",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentSecurityPolicy.MaxConcurrentSessions",
      "Body": "Department Security Policy / Max Concurrent Sessions. Maximum policy-managed concurrent sessions per user; zero means unlimited for this setting. Existing sessions and enforcement rollout must be checked separately.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "table-departmentsecuritypolicy-maxconcurrentsessions",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentSecurityPolicy.AllowedIpRanges",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentSecurityPolicy.AllowedIpRanges",
      "Body": "Department Security Policy / Allowed Ip Ranges. Allowed login network ranges. Empty adds no range restriction. Review legitimate responder networks and recovery access before narrowing it.",
