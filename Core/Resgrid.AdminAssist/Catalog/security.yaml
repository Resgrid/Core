      "Anchor": "table-departmentsecuritypolicy-passwordexpirationdays",
      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentSecurityPolicy.MinPasswordLength",
