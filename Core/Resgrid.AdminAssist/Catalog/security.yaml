      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentSecurityPolicy.SessionTimeoutMinutes",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentSecurityPolicy.SessionTimeoutMinutes",
      "Body": "Department Security Policy / Session Timeout Minutes. Idle timeout in minutes; zero defers to host behavior. Verify policy-managed sessions and each supported client rather than assuming immediate global logout.",
