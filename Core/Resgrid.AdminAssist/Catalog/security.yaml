      "PackVersion": "2026.09.25.1",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "table.DepartmentSecurityPolicy.RequireSso",
      "Locale": "en",
      "TitleKey": "TableField.DepartmentSecurityPolicy.RequireSso",
      "Body": "Department Security Policy / Require Sso. Requires the supported SSO policy gate. Verify the active identity provider and local recovery arrangements before removing a sign-in path.",
