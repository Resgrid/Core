      "TitleKey": "Feature.shifts",
      "Body": "Shifts Shift schedules, sign-ups and trades. Shifts show who is on duty and can drive dispatch, so calls page the people who are actually working. A career department sets up A, B and C shifts, and a volunteer department uses shift sign-ups for weekend duty crews. Create your shifts, assign groups and members, and decide whether dispatch follows shifts.",
