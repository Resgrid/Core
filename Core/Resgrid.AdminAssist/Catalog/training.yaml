      "Locale": "en",
      "TitleKey": "Field.LmsStandardsSettings.XapiEnabled",
      "Body": "xAPI (LRS) settings / Send xAPI statements. Course and lesson results (attempted, completed, passed, failed) are queued and sent to the LRS by the standards worker, with retries.",
