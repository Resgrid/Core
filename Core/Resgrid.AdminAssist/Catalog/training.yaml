      "TitleKey": "Field.TrainingRecordSettings.RoleReviewersOwnGroupOnly",
      "Body": "Training record settings / Role reviewers only for their own group. When on, reviewers named by role (Record Training Completions or Assign Training) review only the members of the group they are in. Department admins still review everyone and group admins their own group.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-trainingrecordsettings-rolereviewersowngrouponly",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.TrainingRecordSettings.ReviewerNotices",
      "Locale": "en",
      "TitleKey": "Field.TrainingRecordSettings.ReviewerNotices",
      "Body": "Training record settings / Reviewer notices. How reviewers hear about new submissions: a notice for each one (the default), one summary a day, or none (the Training reviews inbox and the home page item only).",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-trainingrecordsettings-reviewernotices",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "training-submission-reviews",
      "Locale": "en",
      "TitleKey": "Feature.training-submission-reviews",
      "Body": "Training reviews (members' training hours with evidence) Members record continuing education or training hours done elsewhere with a certificate, photo, document or receipt; reviewers approve them, deny them or ask for more information. Outside training reaches the transcript with its proof, reviewed when the department wants it, and members are told at every step. A member uploads a photo of a hazardous materials refresher certificate with 8 hours; the training captain sees it in Training reviews, opens the photo and approves it. Choose the review in Training record settings and give training captains and instructors Record Training Completions on the Security page.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-submission-reviews",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "training-transcript",
      "Locale": "en",
      "TitleKey": "Feature.training-transcript",
      "Body": "Training Transcript Each member's course completions, training records, calendar attendance, imports and outside certificates, with their hours and whether they count. One record of every member's training and hours for renewals and audits, without adding up sign-in sheets by hand. Before renewing a certification, a member downloads their transcript as a PDF with hours by category, and the training officer opens the same transcript from the member's name. Open Trainings and choose My transcript. Officers who review a member's records pick the member on the transcript. Only verified records count toward hours.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-transcript",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "training-external-submissions",
      "Locale": "en",
      "TitleKey": "Feature.training-external-submissions",
      "Body": "Outside Training Submissions Members submit courses they completed outside the department, with hours and evidence (a certificate, photo, document or receipt); a reviewer approves or denies each one in Training reviews, unless the department accepts them as self-reported. Outside courses and continuing education reach the transcript with proof attached, checked by a reviewer when the department wants that. A member finishes an online safety course and submits it with the certificate and 4 hours; the training officer approves it in Training reviews and the hours count. Members choose Submit outside training on their transcript. Reviewers open Training reviews to approve, deny or ask for more information; possible duplicates stay in the records queue. Submissions can be switched off in Training record settings.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-external-submissions",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "training-categories",
      "Locale": "en",
      "TitleKey": "Feature.training-categories",
      "Body": "Training Categories Group training hours into categories with optional hour targets and retention, start from templates for fire (ISO), EMS (NCCP), workplace safety (OSHA), industry, search and rescue, law enforcement, security, CPD, Canada or the EU, and categorize existing records in bulk. Hours add up the way your regulator, licensing body, insurer or accreditor asks for them, and targets show who is behind. A department applies the ISO template, sets an annual target for company training, then categorizes last year's drill records in bulk by course name. In Trainings, open Training records, then Training categories. Apply a template or add your own, then use Categorize history to give uncategorized records a category.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-categories",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "training-credit-mappings",
      "Locale": "en",
      "TitleKey": "Feature.training-credit-mappings",
      "Body": "Certification Credit Mappings Count a training category's verified hours toward a certification's renewal, for the whole category or only one part of it. Renewal hours fill in from the training members already do, instead of being typed onto each certification. Hours in the EMS continuing education category count toward the EMT certification, so a member's renewal progress moves as soon as a session is verified. In Trainings, open Training records, then Certification credits, and map a category to a certification type. Records completed before the mapping was turned on become credits only when you apply history.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-credit-mappings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "training-history-backfill",
      "Locale": "en",
      "TitleKey": "Feature.training-history-backfill",
      "Body": "Training History Backfill Bring training completions and training records from before the transcript onto members' transcripts, with a dry run that counts what would be written. Transcripts start with the history your department already has in Resgrid instead of empty. An officer runs a dry run, sees how many past completions and training records were found, then starts the backfill, which keeps running in the background. In Trainings, open Training records, then History backfill, and run a dry run first. Backfilled records become certification credits only when you apply history to a certification type.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-history-backfill",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "training-history-import",
      "Locale": "en",
      "TitleKey": "Feature.training-history-import",
      "Body": "Training History Import Import completions from another system with a CSV file: check how each row matched a member, fix the rows that did not match, then import. Years of records from a spreadsheet or a previous training system reach members' transcripts without retyping. A department leaving its old records system exports its completions, imports them, and picks the right member for the few rows matched by name only. In Trainings, open Training records, then Import training history. Download the template, fill in one row per completion with the member, course, date and hours, upload it and review the check before importing.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-history-import",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "training-hours-report",
      "Locale": "en",
      "TitleKey": "Feature.training-hours-report",
      "Body": "Training Hours Report Verified training hours by category, member or month, with CSV and PDF export and former members on request. Answer how many hours the department trained, and in what, for budgets, grants and annual reports. For the annual report, the chief exports last year's training hours by category as a PDF. In Trainings, open Training records, then Training hours. Choose the period and grouping, then export to CSV or PDF.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-hours-report",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "lms-seats",
      "Locale": "en",
      "TitleKey": "Feature.lms-seats",
      "Body": "LMS Seats Switch the LMS on for members one at a time on their personnel page, or for a whole group at once, within the seats your packs buy. You pay only for the members you train through the LMS; everyone else keeps the free Training module. A combination department enables its 40 career staff for LMS courses and leaves its volunteers on free Training. In Personnel, use LMS seats to enable a group, or open a member and choose Enable LMS. Only active members can hold a seat; add a pack when the seats run out.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-seats",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "lms-packs",
      "Locale": "en",
      "TitleKey": "Feature.lms-packs",
      "Body": "LMS Packs Buy the LMS add-on in 25-member packs and change the number of packs, with the price shown before any change. The bill follows the seats you need: graduated tiers make large rosters cheaper per member, and added packs are prorated. A department with 110 LMS-enabled members holds 5 packs; when it passes 125 it adds a sixth pack and pays the prorated difference at once. In Subscription, open the LMS card, choose the number of packs and check out. Removing packs takes effect at the next billing date.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-packs",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-24T00:00:00Z"
    },
    {
      "Id": "my-courses",
      "Locale": "en",
      "TitleKey": "Feature.my-courses",
      "Body": "My Courses The courses assigned to a member, the courses they can join and the Resgrid Academy lessons, with progress and due dates. Members see what to finish next and pick up where they stopped, on the website or in the mobile app. A new member opens My courses, finishes the Getting started lesson and its short check, and the completion appears on their transcript. Open Trainings and choose Courses. Assigned courses come first; Resgrid Academy lessons are always there while the Training module is on.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "my-courses",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "academy",
      "Locale": "en",
      "TitleKey": "Feature.academy",
      "Body": "Resgrid Academy Short Resgrid video lessons, each with a three-question check, published by Resgrid for every department at no cost, plus role paths for members, dispatchers, officers and administrators. New members and officers learn the system the same way, and each finished lesson counts on their transcript under Systems training. The training officer assigns the Dispatcher path to new dispatch staff and follows which lessons each person has finished. Open Trainings and choose Academy. People who can assign training assign a lesson or a role path to members, roles or groups. Lessons for modules or add-ons the department does not use stay hidden.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "academy",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-course-builder",
      "Locale": "en",
      "TitleKey": "Feature.lms-course-builder",
      "Body": "Course Builder Department-built courses with modules, video, documents, protocol lessons, assessments drawn from question banks and surveys, approved and versioned like protocols. Run the department's own training online, with scored assessments, seat time and completions that issue or renew certifications. The EMS coordinator builds a yearly refresher with a video and a 20-question test drawn from a bank with a pass mark of 80%, then assigns it to every EMT. Nothing to set up yet: the course builder is part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-course-builder",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-grading",
      "Locale": "en",
      "TitleKey": "Feature.lms-grading",
      "Body": "Assessment Grading A queue of free-text answers waiting for a grader, and item analysis showing how hard each question is and how well it separates strong and weak results. Written answers get a fair, recorded grade, and weak questions are found and fixed. A training officer grades three short answers on last week's hazmat test; the analysis shows one question nearly everyone misses, so it is rewritten. Nothing to set up yet: grading is part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-grading",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "academy-guidance",
      "Locale": "en",
      "TitleKey": "Feature.academy-guidance",
      "Body": "Guided tours and What's new First-run tasks for each role built on the Academy walkthroughs, and a short lesson on each release. New members and administrators know what to do first, and everyone sees what changed. A new dispatcher ticks off opening the call list, checking units and the map. Nothing to set up: each member sees the tour for their role on the dashboard and can hide it.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "academy-guidance",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "setting.LmsProgramSettings",
      "Locale": "en",
      "TitleKey": "Setting.LmsProgramSettings",
      "Body": "Training program settings. How training requests are approved and in which currency their costs are entered, and whether Records inspections and pre-plan reviews credit building familiarization.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-lmsprogramsettings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsProgramSettings.RequestSupervisorApproval",
      "Locale": "en",
      "TitleKey": "Field.LmsProgramSettings.RequestSupervisorApproval",
      "Body": "Training program settings / Supervisor approves training requests. The admins of the member's group (or the department admins) approve a training request first.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsprogramsettings-requestsupervisorapproval",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsProgramSettings.RequestTrainingOfficerApproval",
      "Locale": "en",
      "TitleKey": "Field.LmsProgramSettings.RequestTrainingOfficerApproval",
      "Body": "Training program settings / Training officer approves training requests. A member who manages training records for the whole department approves the request, after the supervisor when both are on.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsprogramsettings-requesttrainingofficerapproval",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsProgramSettings.RequestCurrency",
      "Locale": "en",
      "TitleKey": "Field.LmsProgramSettings.RequestCurrency",
      "Body": "Training program settings / Training currency. The three-letter currency code (EUR, CAD, USD …) the department's training request costs, class costs and class fees are entered and totalled in. A class can name its own.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsprogramsettings-requestcurrency",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsProgramSettings.FamiliarizationEnabled",
      "Locale": "en",
      "TitleKey": "Field.LmsProgramSettings.FamiliarizationEnabled",
      "Body": "Training program settings / Credit building familiarization. Completed occupancy inspections and pre-plan reviews in Records go on the transcript of the person who did them.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsprogramsettings-familiarizationenabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsProgramSettings.FamiliarizationCategoryId",
      "Locale": "en",
      "TitleKey": "Field.LmsProgramSettings.FamiliarizationCategoryId",
      "Body": "Training program settings / Familiarization category. The training category familiarization credit lands in, for example the ISO pre-fire planning category.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsprogramsettings-familiarizationcategoryid",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsProgramSettings.FamiliarizationMinutes",
      "Locale": "en",
      "TitleKey": "Field.LmsProgramSettings.FamiliarizationMinutes",
      "Body": "Training program settings / Minutes per visit. The minutes credited for a visit that has no start and end time. A visit with its own times is credited its real length.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsprogramsettings-familiarizationminutes",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsProgramSettings.FamiliarizationFromInspections",
      "Locale": "en",
      "TitleKey": "Field.LmsProgramSettings.FamiliarizationFromInspections",
      "Body": "Training program settings / Credit from inspections. Completed occupancy inspections credit the inspector.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsprogramsettings-familiarizationfrominspections",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsProgramSettings.FamiliarizationFromPreplanReviews",
      "Locale": "en",
      "TitleKey": "Field.LmsProgramSettings.FamiliarizationFromPreplanReviews",
      "Body": "Training program settings / Credit from pre-plan reviews. Occupancy and contact pre-plan reviews credit the reviewer.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsprogramsettings-familiarizationfrompreplanreviews",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-training-plan",
      "Locale": "en",
      "TitleKey": "Feature.lms-training-plan",
      "Body": "Annual Training Plan A year of planned sessions and hours per category and month for the department, a group or a shift, compared with the hours actually recorded. The written plan auditors, regulators and accreditors ask for, and a shortfall against the annual targets that shows in June, not at the audit. The training officer plans 16 hours of company training each month; by June the forecast shows the department will miss the 192-hour target by 20 hours. Nothing to set up yet: the annual plan is part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-training-plan",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-competency-frameworks",
      "Locale": "en",
      "TitleKey": "Feature.lms-competency-frameworks",
      "Body": "Competency Frameworks Job performance requirements, positions and skills, tagged on the courses, trainings and certifications that evidence them, with a gap report per member. Shows for every member which requirements have evidence, how old it is, and which have none. A department imports its regulator's competency framework, tags its courses, and sees a recruit still has no evidence for three requirements. Nothing to set up yet: competency frameworks are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-competency-frameworks",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-training-requests",
      "Locale": "en",
      "TitleKey": "Feature.lms-training-requests",
      "Body": "Training Requests Members ask to attend an outside class with its cost; the supervisor and a training officer approve it, and the class goes on the transcript once taken. One approved, costed record per outside class, and spending totals per member, course and year. A paramedic asks to attend a 16-hour course costing 450 dollars; the captain and the training officer approve it, and the certificate is verified afterwards. Nothing to set up yet: training requests are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-training-requests",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-report-catalog",
      "Locale": "en",
      "TitleKey": "Feature.lms-report-catalog",
      "Body": "Training Report Catalog Every training report in one place, saved with its settings in folders and sent on a daily, weekly or monthly schedule as CSV or PDF. The reports an audit needs arrive by themselves, already filtered the same way every time. The ISO training report goes to the chief and the training officer as a PDF on the first of every month. Nothing to set up yet: saved and scheduled reports are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-report-catalog",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-certification-cycles",
      "Locale": "en",
      "TitleKey": "Feature.lms-certification-cycles",
      "Body": "Certification Cycles A certification's next cycle starts by itself once its renewal hours are met, and supervisors, admins or named members are alerted when a cycle completes, starts, nears expiry or expires. Recurring credentials keep tracking hours without anyone re-entering them, and the right people hear about them in time. When an EMT reaches the renewal hours, the next two-year cycle starts at the current expiry and the EMS captain gets a note. Nothing to set up yet: certification cycle rules are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-certification-cycles",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-credential-audiences",
      "Locale": "en",
      "TitleKey": "Feature.lms-credential-audiences",
      "Body": "Messages by Certification Status Send a message to the members whose certification has expired, expires within a number of days, or who never held it. Reminders reach exactly the people who need them, without building a list by hand. The training officer messages everyone whose CPR card expires within 30 days with the date of the next class. Nothing to set up yet: certification-status audiences are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-credential-audiences",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-protocol-learning",
      "Locale": "en",
      "TitleKey": "Feature.lms-protocol-learning",
      "Body": "Protocol Quizzes and Micro-Learning Make a protocol's acknowledgment wait for a quiz drawn from a question bank, and send members one scenario question a week from chosen protocols. Members show they understood a protocol, not only that they opened it, and keep it fresh between reviews. A new mayday procedure needs five questions passed at 80% before the acknowledgment counts, and every Monday each firefighter answers one scenario from it. Nothing to set up yet: protocol quizzes and micro-learning are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-protocol-learning",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "setting.LearningRequirementSettings",
      "Locale": "en",
      "TitleKey": "Setting.LearningRequirementSettings",
      "Body": "Learning requirement settings. Training-backed enforcement for the department (off by default), the largest share of a role's members one enforcement run may remove, and the default at-risk warning for new requirements.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-learningrequirementsettings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LearningRequirementSettings.EnforcementEnabled",
      "Locale": "en",
      "TitleKey": "Field.LearningRequirementSettings.EnforcementEnabled",
      "Body": "Learning requirement settings / Training-backed enforcement. When on, a requirement that opts in can expire the certification it backs once a member is overdue past the grace period; the certification module then removes roles after its own grace period. Off by default, never while the LMS add-on is inactive, and turning it on first shows who would lose which role.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-learningrequirementsettings-enforcementenabled",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LearningRequirementSettings.MaxRoleRemovalSharePercent",
      "Locale": "en",
      "TitleKey": "Field.LearningRequirementSettings.MaxRoleRemovalSharePercent",
      "Body": "Learning requirement settings / Largest share of a role removed in one run. A run that would remove more than this percentage of a role's active members is refused, and the department admins are told. Default 20.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-learningrequirementsettings-maxroleremovalsharepercent",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LearningRequirementSettings.DefaultAtRiskDays",
      "Locale": "en",
      "TitleKey": "Field.LearningRequirementSettings.DefaultAtRiskDays",
      "Body": "Learning requirement settings / Default at-risk warning. Days before the due date a new requirement starts showing members at risk. Default 14.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-learningrequirementsettings-defaultatriskdays",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-requirements",
      "Locale": "en",
      "TitleKey": "Feature.lms-requirements",
      "Body": "Learning Requirements Recurring and one-time training requirements by role, group, certification or shift: courses, trainings, hours per category, learning paths and passed skill evaluations, with due dates from when members join or are given a role. Everyone knows what they owe and by when, and officers see who is at risk before an audit. Every engineer completes the pump operations course every 12 months, and every member logs 24 hours of company training per calendar year. Open Trainings, choose Programs and add a requirement.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-requirements",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-compliance-matrix",
      "Locale": "en",
      "TitleKey": "Feature.lms-compliance-matrix",
      "Body": "Compliance Matrix Each member against each requirement: compliant, due later, at risk, overdue, exempt, on leave or not licensed, with CSV and PDF export and a group admin's own group. One page answers who is out of compliance and what is due next. A captain filters the matrix to their station and exempts a member on military leave. Open Trainings, choose Programs, then Compliance.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-compliance-matrix",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-learning-paths",
      "Locale": "en",
      "TitleKey": "Feature.lms-learning-paths",
      "Body": "Learning Paths and Onboarding Ordered courses, Academy lessons and trainings with prerequisites and electives; finishing a path can issue a certification. A path per role can be assigned automatically when someone joins or is given the role. New members follow the same onboarding with a due date, without anyone remembering to assign it. New dispatchers get the Dispatcher path with 30 days to finish it, and finishing it issues the department's dispatcher certification. Open Trainings, choose Programs, then Paths to build a path and Onboarding to assign it by role.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-learning-paths",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-recommendations",
      "Locale": "en",
      "TitleKey": "Feature.lms-recommendations",
      "Body": "Learning recommendations Recommends learning paths and courses to each member from their open requirements, the paths they are on, their competency gaps and the courses offered to their roles. Members see what to take next and why, and officers see the same for the members they supervise. A firefighter with no evidence for the ladder competency sees the ladder operations course recommended under My Training, with the reason. Open Trainings, choose Programs, then Recommendations; members also see Recommended on My Training. Explain with AI needs Enhanced AI. The ranking is the same for everyone with the same requirements and gaps; the optional explanation sends only course titles and reasons, never names.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-recommendations",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-class-sessions",
      "Locale": "en",
      "TitleKey": "Feature.lms-class-sessions",
      "Body": "Class Sessions Instructor-led classes on the calendar with capacity, waitlist, enrolment rules, rotating-QR and GPS sign-in, and an instructor sign-off that writes every attendee's training record. One roster per class that stands as the record: who taught, who attended, what was covered and for how long, kept for the category's retention. A bloodborne pathogens refresher for 20 seats fills up; three members wait on the waitlist, and when one withdraws the next is enrolled and notified. Nothing to set up yet: class sessions are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-class-sessions",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-lesson-plans",
      "Locale": "en",
      "TitleKey": "Feature.lms-lesson-plans",
      "Body": "Lesson Plans Reusable plans for instructor-led sessions: objectives, competencies covered, materials and props, instructor-to-student ratio, safety plan and pre-brief checklist, versioned and approved before use. Live-fire, driving and SCBA sessions are taught from an approved plan, and the roster shows which version was used. The training officer copies the live-fire starter plan, adds the department's burn building and ratios, and a chief approves it before the first evolution. Nothing to set up yet: lesson plans are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-lesson-plans",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-training-resources",
      "Locale": "en",
      "TitleKey": "Feature.lms-training-resources",
      "Body": "Facility and Prop Booking The organization's training grounds, classrooms, props, vehicles and equipment, booked for class times so nothing is double-booked. Two classes never plan on the same burn building or engine for the same afternoon. The ladder evolution books the training tower and Engine 3 for Saturday morning; a second class asking for the tower then is refused. Nothing to set up yet: facility booking is part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-training-resources",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "setting.LmsSkillSettings",
      "Locale": "en",
      "TitleKey": "Setting.LmsSkillSettings",
      "Body": "Skill notice settings. How skill evaluation and task book notices are delivered, immediately or as a daily or weekly digest, and whether the evaluated members and the department admins receive them.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "setting-lmsskillsettings",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
