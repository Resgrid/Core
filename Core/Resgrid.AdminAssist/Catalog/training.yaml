      "TitleKey": "Feature.trainings",
      "Body": "Trainings Training assignments with materials and optional quizzes. See who is qualified and whose certifications are expiring before it affects who can respond. EMT and Driver/Operator certification types are added with their renewal periods, and an annual refresher training is assigned to every member. Create a training and assign it to the members or groups who need it.",
