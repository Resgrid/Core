    },
    {
      "Id": "lms-content-standards",
      "Locale": "en",
      "TitleKey": "Feature.lms-content-standards",
      "Body": "SCORM, cmi5, xAPI and LTI Import SCORM 1.2/2004 and cmi5 packages played in a sandboxed player, launch third-party CE courses over LTI 1.3 with score passback, and send results to an external LRS as xAPI statements. Partner and purchased e-learning runs inside Resgrid and lands on the transcript, and results can flow to the department's own LRS. A CAPCE provider's cardiac course launches from a course lesson over LTI; the score comes back, the lesson completes and the credit lands on the member's transcript. Open Trainings, choose Standards, upload a package or register an LTI tool, then add a SCORM, cmi5 or LTI lesson to a course.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-content-standards",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-certification-requirements",
      "Locale": "en",
      "TitleKey": "Feature.lms-certification-requirements",
      "Body": "Certification Requirement Sets A certification is issued or renewed automatically when a member completes every item of its set inside the cycle: LMS courses, a course set, trainings, a supervised practical recorded by an instructor, skill evaluations or continuing-education hours. Voiding a completion behind it takes the certification back. Members and officers see exactly what is left (\"3 of 4 done\"), nobody re-enters a renewal by hand, and a mistaken completion never leaves a certification standing on nothing. An operator certification needs the yearly driving course, the vehicle checks course and a slow speed course an instructor signs off; when the last one is recorded the certification renews to the next 31 December. Nothing to set up yet: certification requirement sets are part of the LMS add-on, which is not available yet.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-certification-requirements",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "certification-validity-rules",
      "Locale": "en",
      "TitleKey": "Feature.certification-validity-rules",
      "Body": "Certification Validity Rules A certification type expires a number of months after issue, at the end of each calendar year, at the end of the organization's own year, or on a fixed date, with an optional grace period and renewal window. Annual and fiscal-year authorizations expire the same day for everyone, renewals land in the right year, and dates follow the organization's time zone. A forklift authorization set to expire on 31 March each year renews to the following 31 March when the refresher is completed in February. Open Certifications, then a certification type, and choose how it expires.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "certification-validity-rules",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "training-read-and-confirm",
      "Locale": "en",
      "TitleKey": "Feature.training-read-and-confirm",
      "Body": "Read and Confirm Trainings A training without a quiz can ask each member to confirm they read and reviewed it before its due date, and repeat every year: an employee handbook, a code of conduct or a site rule. Opening a document is no longer counted as reading it: the record shows who confirmed and when, ready for an audit. The employee handbook is assigned every January with a 31 January due date; each member ticks \"I have read and reviewed this training\" and the transcript shows the date. Create a training, attach or write the document, tick \"Members confirm they have read and reviewed it\", set a due date and repeat every 12 months.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "training-read-and-confirm",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "course-sets",
      "Locale": "en",
      "TitleKey": "Feature.course-sets",
      "Body": "Course Sets Publish trainings (and, with the LMS, courses and learning paths) to linked organizations as a set; subscribers receive their own copies, locked or open as the publisher chooses, and each update arrives in their inbox to go into force at their update time. Trainings need no add-on, and quiz changes flow down with each update.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "course-sets",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-26T00:00:00Z"
    },
    {
      "Id": "lms-course-sets",
      "Locale": "en",
      "TitleKey": "Feature.lms-course-sets",
      "Body": "LMS Courses And Paths In Sets LMS courses and learning paths travel in course sets: hosted video and SCORM or cmi5 packages are shared with the subscriber, an LTI lesson uses the subscriber's own registration with the tool (its managers are told to finish it), and a path points at the subscriber's copies of its courses. Needs the subscriber's LMS add-on or the publisher's sponsorship.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-course-sets",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-26T00:00:00Z"
    },
    {
      "Id": "lms-sponsorship",
      "Locale": "en",
      "TitleKey": "Feature.lms-sponsorship",
      "Body": "Sponsored LMS Seats Pay for a linked department's LMS-enabled members from your own packs, optionally up to a seat limit. The sponsored department needs no add-on, may be on the free plan, runs your course sets only and sees who pays; ending the sponsorship or the link lapses access with the usual lapse rules.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-sponsorship",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-26T00:00:00Z"
    }
  ]
}
