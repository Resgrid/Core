    {
      "Id": "field.LmsStandardsSettings.ShareEmailInActor",
      "Locale": "en",
      "TitleKey": "Field.LmsStandardsSettings.ShareEmailInActor",
      "Body": "xAPI (LRS) settings / Identify members by e-mail. Off: each member is a pseudonymous department account. On: the member's e-mail address is sent as the statement's actor.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
