      "Anchor": "field-lmsskillsettings-digesthour",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsSkillSettings.DigestWeekday",
      "Locale": "en",
      "TitleKey": "Field.LmsSkillSettings.DigestWeekday",
      "Body": "Skill notice settings / Skill weekly digest day. The weekday weekly digests are sent.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsskillsettings-digestweekday",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsSkillSettings.NotifyMembers",
      "Locale": "en",
      "TitleKey": "Field.LmsSkillSettings.NotifyMembers",
      "Body": "Skill notice settings / Notify evaluated members. The evaluated members and trainees receive notices about their own evaluations and task books.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsskillsettings-notifymembers",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsSkillSettings.NotifyOfficers",
      "Locale": "en",
      "TitleKey": "Field.LmsSkillSettings.NotifyOfficers",
      "Body": "Skill notice settings / Notify department admins. The active department admins receive a notice about every evaluation and task book.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsskillsettings-notifyofficers",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-skill-sheets",
      "Locale": "en",
      "TitleKey": "Feature.lms-skill-sheets",
      "Body": "Skill Sheets Job-performance skill sheets with ordered steps, critical criteria that fail the evaluation, rating scales, timers and evidence, versioned, with a library of Resgrid starters. Every evaluator grades the same skill the same way, and the department can show exactly what was checked. The SCBA donning sheet fails anyone who takes longer than 60 seconds or misses the facepiece seal check. Open Trainings, choose Skills, then Skill sheets, and start from a template.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-skill-sheets",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-skill-evaluations",
      "Locale": "en",
      "TitleKey": "Feature.lms-skill-evaluations",
      "Body": "Skill Evaluations Evaluator mode: grade one member or a whole crew on a skill sheet, with Pass All, annotations and evidence, then sign at L2; passed evaluations land on the transcript and the record is sealed. Skills checked on the drill ground become signed, sealed proof that requirements and certifications can count. A captain grades Engine 2's crew on the hoseline advance on one form, splits out the member who struggled, and signs from a tablet. Publish a skill sheet, set who may evaluate on it, then choose Start an evaluation under Trainings, Skills.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-skill-evaluations",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-task-books",
      "Locale": "en",
      "TitleKey": "Feature.lms-task-books",
      "Body": "Position Task Books Task books on the NWCG model: initiated with a position code and date, tasks signed by qualified evaluators across dates and incidents, recommended by a final evaluator and certified by the certifying official; certification activates the trainee's certification. Trainee positions move to qualified with a full, signed trail instead of a paper book in a locker. An FFT2 trainee's task book is initiated in March, two incident tasks are signed on wildfires that summer, and the certifying official certifies it in September. Open Trainings, choose Skills, then Definitions, start from a task book starter, set who signs and certifies, then initiate books under Task books.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-task-books",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
