      "Locale": "en",
      "TitleKey": "Field.LmsCeReportingSettings.CeBrokerProviderNumber",
      "Body": "CE reporting settings / CE Broker provider number. The CE Broker provider tracking number (Florida) written in column A of the CE Broker file without its 50- prefix.",
