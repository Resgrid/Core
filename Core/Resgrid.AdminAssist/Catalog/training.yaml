      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-data-export",
      "Locale": "en",
      "TitleKey": "Feature.lms-data-export",
      "Body": "Training data export Department owners and admins export everything the department put into Training: courses with their versions, lessons and media, question banks with answer keys, and every learning record, attempt and certificate as CSV and xAPI statements, with a SCORM 1.2 package per course where the lessons allow. A department can always take its training content and evidence with it, also after the LMS add-on lapses. Before moving to a regional academy's system, the training officer exports everything, loads the xAPI statements into the new record store and keeps the CSV records for the audit. Open Trainings, choose Programs, then Data export, pick Everything or Records only and start the export; download the zip when it is ready.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-data-export",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-ce-reporting",
      "Locale": "en",
      "TitleKey": "Feature.lms-ce-reporting",
      "Body": "CE reporting files Builds a CE / CPD training-hours file with the columns your regulator or professional body asks for, and for US departments the CAPCE completion file, state CE files (Florida's CE Broker layout and a configurable CSV for other states) and a state-ready roster for systems such as Acadis, with a preview and per-department columns. Completions reach your regulator, professional body, CAPCE or state office without retyping a roster, and nothing is submitted before someone checks the file. Each month the EMS coordinator previews last month's CAPCE file, fixes two members missing a state license number and uploads the CSV to CAPCE. Open Trainings, choose Programs, then CE reporting, enter the provider numbers and the certification types that hold license numbers, then build a file for a date range.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-ce-reporting",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "lms-starter-courses",
      "Locale": "en",
      "TitleKey": "Feature.lms-starter-courses",
      "Body": "Starter courses Courses written by Resgrid (getting started with Resgrid, incident safety basics, a hazardous materials awareness outline, driver basics) to copy into the department as a draft. A department gets a structured first course in minutes and adapts it to its own procedures; the copy keeps its attribution, and partner slots show where accredited content will plug in. A volunteer department copies Getting started with Resgrid, adds its radio channels and station names, and assigns it to every new member after approval. Needs the LMS add-on and Manage Courses; open Trainings, Course library, Starter courses. Starters carry no standard's text and no accreditation.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "lms-starter-courses",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "setting.LmsStandardsSettings",
      "Locale": "en",
      "TitleKey": "Setting.LmsStandardsSettings",
      "Body": "xAPI (LRS) settings. Whether LMS course and lesson results are sent as xAPI statements to the department's Learning Record Store, with which key and secret, and whether members are identified by e-mail address.",
