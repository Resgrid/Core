      "TitleKey": "Field.LmsStandardsSettings.LrsEndpoint",
      "Body": "xAPI (LRS) settings / LRS endpoint. The https address of the Learning Record Store's xAPI endpoint; statements are posted to its statements resource.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsstandardssettings-lrsendpoint",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
    },
    {
      "Id": "field.LmsStandardsSettings.LrsKey",
      "Locale": "en",
      "TitleKey": "Field.LmsStandardsSettings.LrsKey",
      "Body": "xAPI (LRS) settings / LRS key. The basic-auth key (user name) the LRS issued.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "field-lmsstandardssettings-lrskey",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-11-25T00:00:00Z"
