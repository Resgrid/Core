    {
      "Id": "field.LmsStandardsSettings.LrsSecretEncrypted",
      "Locale": "en",
      "TitleKey": "Field.LmsStandardsSettings.LrsSecretEncrypted",
      "Body": "xAPI (LRS) settings / LRS secret. The basic-auth secret, stored encrypted for the department and never shown again.",
