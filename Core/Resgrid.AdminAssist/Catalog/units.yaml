    {
      "Id": "units",
      "Locale": "en",
      "TitleKey": "Feature.units",
      "Body": "Units Your apparatus, vehicles and response teams. Units let dispatchers send the right resources and let everyone see which apparatus is available. Engine 1 and Rescue 1 are added with their unit types and assigned to Station 1. Add each unit with its type and home station group.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "units",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "unit-types",
      "Locale": "en",
      "TitleKey": "Feature.unit-types",
      "Body": "Unit types Categories such as Engine, Ladder or Ambulance. Group comparable resources without assuming staffing or qualification. Engine 1 and Rescue 1 are added with their unit types and assigned to Station 1. Create unit types before adding units so each unit can be classified.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "unit-types",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "hardware-tracking",
      "Locale": "en",
      "TitleKey": "Feature.hardware-tracking",
      "Body": "Hardware location tracking GPS devices that report unit locations. Review device ownership, stale-position behavior and fallback sources. Engine 1 and Rescue 1 are added with their unit types and assigned to Station 1. Register each tracking device and link it to its unit.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
      "Anchor": "hardware-tracking",
      "PackVersion": "2026.09.25.2",
      "Owner": "Resgrid.Core",
      "ReviewedOn": "2026-09-24T00:00:00Z"
    },
    {
      "Id": "new-unit",
      "Locale": "en",
      "TitleKey": "Feature.new-unit",
      "Body": "New Unit Add an apparatus, vehicle or team. Units let dispatchers send the right resources and let everyone see which apparatus is available. Engine 1 and Rescue 1 are added with their unit types and assigned to Station 1. List your apparatus or response teams with their types and home stations. Teams that respond only as individuals can mark this module not applicable.",
      "SourcePath": "docs/admin-assist/settings-reference.md",
