  "Articles": [
    {
      "Id": "workforce-pro-seats",
      "Locale": "en",
      "TitleKey": "Feature.workforce-pro-seats",
      "Body": "Workforce Pro Seats Switch Workforce Pro on for the members whose wellness and workplace exposure records your organization keeps, within the seats your 25-member packs buy. You pay only for those members; officers and managers acting on others need their permission, not a seat. A combination department switches Workforce Pro on for its 40 career staff and leaves its volunteers off. Open Workforce Pro seats from the Workforce Pro add-on page and switch members on. Switching a member off never deletes a record: their records become read-only. If the add-on ends, existing records stay readable and exportable.",
