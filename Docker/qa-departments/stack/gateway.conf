# TLS in front of the API and eventing hosts. The original Host goes through: the API derives its token issuer from it,
# and eventing validates tokens against ResgridApiBaseUrl (https://localhost:5443).
# the apps only talk https to anything but a development build's localhost.
# private/tls holds a self-signed localhost certificate that qa-stack.py creates.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# Core's access tokens carry the member's claims and run to about 10 KB; nginx's default 8 KB header buffer answers 400.
large_client_header_buffers 8 32k;
# Resolve the hosts per request through Docker's DNS: restarting api or eventing can give them new addresses.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 8443 ssl;
  server_name localhost;
  ssl_certificate /etc/nginx/tls/localhost.crt;
  ssl_certificate_key /etc/nginx/tls/localhost.key;
  client_max_body_size 64m;
  location / {
    set $api http://api:8080;
    proxy_pass $api;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
  }
}

server {
  listen 8444 ssl;
  server_name localhost;
  ssl_certificate /etc/nginx/tls/localhost.crt;
  ssl_certificate_key /etc/nginx/tls/localhost.key;
  location / {
    set $eventing http://eventing:8080;
    proxy_pass $eventing;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
  }
}

# Plain http for native development builds on simulators and emulators (the apps allow http only to localhost in a
# development build), so no certificate has to be installed on a device. Core sees the same https origin as the TLS
# listeners above, so tokens carry one issuer whichever door they came through; the public https URLs Core puts in its
# answers (eventing URL, avatars) are rewritten to these http doors.
server {
  listen 8450;
  server_name localhost;
  client_max_body_size 64m;
  location / {
    set $api http://api:8080;
    proxy_pass $api;
    proxy_set_header Host localhost:5443;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 300s;
    sub_filter_types application/json text/plain;
    sub_filter_once off;
    sub_filter 'https://localhost:5444' 'http://localhost:5451';
    sub_filter 'https://localhost:5443' 'http://localhost:5450';
  }
}

server {
  listen 8451;
  server_name localhost;
  location / {
    set $eventing http://eventing:8080;
    proxy_pass $eventing;
    proxy_set_header Host localhost:5444;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Accept-Encoding "";
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_read_timeout 3600s;
    sub_filter_types application/json text/plain;
    sub_filter_once off;
    sub_filter 'https://localhost:5443' 'http://localhost:5450';
  }
}
